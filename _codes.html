<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>codes — Code 128 / EAN-13</title>
<style>body{background:#0A0A0B;color:#FAFAFA;font:13px Menlo,Consolas,monospace;padding:20px;white-space:pre-wrap}
.sym{background:#fff;padding:8px;margin:6px 0;display:inline-block}</style></head>
<body>
<div id="out">running…</div>
<div id="vis"></div>

<script src="js/codes.js"></script>
<script>
/* ==========================================================================
   CODE 128 — encoder and decoder, proved against each other and against
   independently-known values.

   A barcode that looks right and does not scan is the worst possible bug in
   this product: it fails silently, in the shop, in front of a customer. So
   nothing here checks "an SVG was produced" — every test either round-trips
   through the decoder or compares against a value computed by hand from the
   spec.
   ========================================================================== */
var R = [];
function ok(n, c, x) { R.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && x !== null ? ' — ' + x : '')); }
function try_(name, fn) {
  try { fn(); } catch (e) { R.push('FAIL ' + name + ' threw — ' + (e && e.message)); }
}

try_('pattern table', function () {
  var P = Codes._c128.PAT;
  ok('107 patterns', P.length === 107, P.length);

  /* Every character is 11 modules wide; STOP alone is 13. Getting one wrong
     shifts every later bar and the symbol silently stops scanning. */
  var bad = [];
  for (var i = 0; i < P.length; i++) {
    var sum = 0;
    for (var j = 0; j < P[i].length; j++) sum += +P[i].charAt(j);
    var want = (i === 106) ? 13 : 11;
    if (sum !== want) bad.push(i + ':' + sum);
  }
  ok('every pattern sums to 11 (STOP 13)', bad.length === 0, bad.slice(0, 4).join(' '));

  /* Six runs each, seven for STOP — the decoder's frame size depends on it. */
  var badLen = [];
  for (var k = 0; k < P.length; k++) {
    var want2 = (k === 106) ? 7 : 6;
    if (P[k].length !== want2) badLen.push(k + ':' + P[k].length);
  }
  ok('six runs each, seven for STOP', badLen.length === 0, badLen.join(' '));

  /* No duplicates, or the decoder's indexOf would resolve ambiguously. */
  var seen = {}, dup = 0;
  P.forEach(function (p) { if (seen[p]) dup++; seen[p] = 1; });
  ok('no duplicate patterns', dup === 0, String(dup));
});

try_('checksum against a known vector', function () {
  /* Checked on an explicit value array, NOT on the optimiser's output, so the
     mod-103 maths is proved on its own. START B(104) A(33) B(34) C(35):
       104 + 33*1 + 34*2 + 35*3 = 104+33+68+105 = 310;  310 % 103 = 1        */
  ok('mod-103 checksum is 1 for [104,33,34,35]',
     Codes.code128Check([104, 33, 34, 35]) === 1,
     String(Codes.code128Check([104, 33, 34, 35])));

  /* And on the optimiser, where the answer differs precisely BECAUSE it
     switches sets. "HI345678" is not nine Set-B characters — the six-digit
     run is packed into Set C:
       START B(104) H(40) I(41) CODE_C(99) 34 56 78
       104 + 40*1 + 41*2 + 99*3 + 34*4 + 56*5 + 78*6 = 1407;  1407 % 103 = 68 */
  var vals = Codes._c128.values('HI345678');
  ok('starts in B for a letter-led string', vals[0] === 104, String(vals[0]));
  ok('switches to set C for the digit run', vals.indexOf(99) === 3, vals.join(','));
  ok('checksum is 68 with the switch', Codes.code128Check(vals) === 68,
     String(Codes.code128Check(vals)));
});

try_('encode / decode round trip', function () {
  var cases = [
    'OG-001-42', 'OG-024-XXL', 'A', 'AB', '12', '1234', '123456',
    '0000000000', 'P-1043', 'INV-2101', 'OG-011-M', 'Nike AF1 42',
    '9', '99', '999', '01234567890123456789', 'a-b_c.d/e', 'X1Y2Z3'
  ];
  var fails = [];
  cases.forEach(function (c) {
    var mods = Codes.code128(c);
    if (!mods) { fails.push(c + ':noenc'); return; }
    var back = Codes.code128Decode(mods);
    if (back !== c) fails.push(c + ' -> ' + back);
  });
  ok('every fixture round-trips', fails.length === 0, fails.join(' | '));

  /* The real payload: every SKU in the catalogue. This is what gets printed. */
  ok('codes.js loaded standalone', typeof Codes === 'object');
});

try_('code set C actually shortens', function () {
  /* Twelve digits in B is 12 characters; in C it is 6 plus a switch. If the
     optimiser is not working the symbol is nearly twice as wide, and a wide
     symbol is what stops a label fitting. */
  var digits = '123456789012';
  var vals = Codes._c128.values(digits);
  ok('a 12-digit string opens in C', vals[0] === 105, String(vals[0]));
  ok('and uses 6 data characters, not 12', vals.length === 7, String(vals.length));
  ok('it still decodes to the same digits',
     Codes.code128Decode(Codes.code128(digits)) === digits);

  /* Mixed content has to survive the switch back to B. */
  var mixed = 'OG-001-42';
  ok('mixed string round-trips through set switches',
     Codes.code128Decode(Codes.code128(mixed)) === mixed, Codes.code128Decode(Codes.code128(mixed)));

  /* An ODD digit run cannot be packed in pairs; the tail must fall back to B
     rather than emitting half a character. */
  var odd = 'AB1234567';
  ok('an odd digit tail still round-trips',
     Codes.code128Decode(Codes.code128(odd)) === odd, Codes.code128Decode(Codes.code128(odd)));
});

try_('refusals', function () {
  ok('empty text encodes to nothing', Codes.code128('') === null);
  ok('non-ASCII is refused rather than mangled', Codes.code128('حذاء') === null);
  ok('a refused code renders no SVG', Codes.code128SVG('حذاء') === '');
});

try_('svg geometry', function () {
  var svg = Codes.code128SVG('OG-001-42', { module: 2, height: 40 });
  var mods = Codes.code128('OG-001-42');
  ok('svg produced', svg.indexOf('<svg') === 0);

  /* Width must be the symbol plus a 10-module quiet zone EACH side. Too
     little white space is the commonest reason a printed code will not read. */
  var w = +/width="(\d+(?:\.\d+)?)"/.exec(svg)[1];
  ok('width includes both quiet zones', w === (10 + mods.length + 10) * 2,
     w + ' vs ' + ((10 + mods.length + 10) * 2));

  /* The first bar must start at x = 10 modules, never at 0. */
  var firstX = +/<rect x="(\d+(?:\.\d+)?)" y="0"/.exec(svg)[1];
  ok('first bar sits after the quiet zone', firstX >= 20, String(firstX));

  /* Bars are merged into runs, so a symbol has far fewer rects than modules. */
  var rects = (svg.match(/<rect /g) || []).length;
  ok('bars merged into runs, not one rect per module', rects < mods.length / 2,
     rects + ' rects for ' + mods.length + ' modules');

  ok('human-readable text is printed under the bars', svg.indexOf('OG-001-42') > -1);
  ok('text can be suppressed', Codes.code128SVG('OG-001-42', { text: false }).indexOf('<text') === -1);
});

try_('ean-13 still works', function () {
  /* Code 128 was spliced into this file; the existing encoder must be intact. */
  ok('ean13 encodes', (Codes.ean13('6221033012844') || '').length === 95);
  ok('check digit maths unchanged', Codes.ean13Check('622103301284') === 4);
  ok('validator unchanged', Codes.ean13Valid('6221033012844') === true &&
                            Codes.ean13Valid('6221033012845') === false);
});

/* Render a few for the eye, after the assertions have done the real work. */
(function () {
  var v = document.getElementById('vis');
  ['OG-001-42', 'OG-024-XXL', '123456789012'].forEach(function (c) {
    v.innerHTML += '<div class="sym">' + Codes.code128SVG(c, { module: 2, height: 44 }) + '</div>';
  });
})();

var fails = R.filter(function (x) { return x.indexOf('PASS') !== 0; });
document.getElementById('out').textContent =
  '=== ' + (R.length - fails.length) + '/' + R.length + ' passed ===\n\n' +
  (fails.length ? 'FAILURES:\n' + fails.join('\n') + '\n\n' : '') + R.join('\n');
</script>
</body></html>
