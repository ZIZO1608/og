# =============================================================================
#  ogsports1.com — the public shop page, served by nginx
# -----------------------------------------------------------------------------
#  Copied into /etc/nginx/conf.d/default.conf, which is included inside the
#  http { } block of the stock nginx.conf, so http-level directives (gzip,
#  types) are legal here.
#
#  Port 8080 rather than 80: nothing in this container needs to be root to
#  bind it, and Coolify's proxy does not care which port it reaches.
# =============================================================================

server {
  listen      8080;
  listen      [::]:8080;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json;

  # ---- what a page may load ------------------------------------------------
  #  This page is self-contained: its stylesheet, its fonts and its images all
  #  come from this origin, and there is no script on it at all. Saying so is
  #  free, and it means a compromised dependency somewhere else cannot execute
  #  here, because there is nowhere else.
  add_header X-Content-Type-Options  "nosniff"                          always;
  add_header X-Frame-Options         "SAMEORIGIN"                       always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

  # ---- gzip ----------------------------------------------------------------
  #  woff2 is left out on purpose: it is already compressed, and gzipping it
  #  spends CPU to make it slightly bigger.
  gzip              on;
  gzip_vary         on;
  gzip_min_length   512;
  gzip_comp_level   6;
  gzip_types        text/plain text/css text/xml application/xml application/xhtml+xml
                    application/javascript application/json image/svg+xml
                    application/manifest+json;

  # ---- the health line Coolify and compose read ----------------------------
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ---- the two files a search engine asks for first ------------------------
  #  Named explicitly so a change to the caching rules below can never put a
  #  long max-age on the sitemap, which is the one file that must be re-read.
  location = /robots.txt {
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    access_log off;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # ---- the mark and the fonts, cached hard ---------------------------------
  #  The same bytes as the shop's app, and they change about once a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800, immutable" always;
    access_log off;
  }

  #  The stylesheet has no hash in its name, so it revalidates. It is 5 KB and
  #  a 304 costs nothing; serving a week-old stylesheet over a new page costs
  #  a site that looks broken.
  location = /style.css {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # ---- the pages -----------------------------------------------------------
  location / {
    #  ALWAYS REVALIDATED. An HTML page held in a browser cache is how an edit
    #  to the shop's own description goes unseen for a week.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    #  The client-side-routing fallback: a path that is not a real file is
    #  answered with index.html, so a single-page app added here later keeps
    #  working on a refresh and on a deep link.
    #
    #  A NOTE FOR THE DAY THIS SITE GROWS REAL PAGES: this answers a mistyped
    #  URL with the home page and a 200, which a search engine reads as a soft
    #  404 and holds against the site. When there is more here than two pages,
    #  make it `try_files $uri $uri/ =404;` and give it a real 404 page.
    try_files $uri $uri/ /index.html;
  }
}
