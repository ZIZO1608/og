<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0B">
<!-- Unreleased client demo: keep it out of search results. GitHub Pages
     cannot set custom headers, so noindex has to live here. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>OG System — Retail Operations</title>
<link rel="icon" href="assets/logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<!-- Fonts vendored locally: no CDN, works offline and inside the service worker -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="tour-root"></div>
<div id="bulk-root"></div>
<div id="print-root" class="print-root"></div>

<button id="tourBtn" class="tour-fab" type="button">
  <span class="tour-fab-dot"></span><span id="tourBtnLabel">Demo tour</span>
</button>

<!-- Chart.js vendored locally — the app now has zero network dependencies. -->
<script src="js/vendor/chart.umd.min.js"></script>
<!-- codes.js first: data.js uses it to stamp valid EAN-13 check digits.
     yalla.js before app.js, same pattern as pos.js. -->
<script src="js/gate.js"></script>
<script src="js/codes.js"></script>
<script src="js/export.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/pos.js"></script>
<script src="js/bulk.js"></script>
<script src="js/yalla.js"></script>
<script src="js/app.js"></script>
<script>
/* Service worker: only registers over http(s). On file:// this is a no-op,
   so double-clicking index.html keeps working exactly as before. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) {
      console.info('SW not registered:', e.message);
    });
  });
}
</script>
</body>
</html>
