<!doctype html>
<!-- Harness for the warehouse map. Underscore-prefixed: never served, never
     deployed — same rule as _shot.html and _l60check.html. Drives the REAL
     js/shelfmap.js and the REAL js/wedge.js against stubbed app globals and
     a fixed sections payload, then asserts geometry, chips, gating and the
     scan flows. ?lang=ar runs the whole thing in RTL, where the grid must
     NOT flip. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>shelf map check</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  /* Just enough of the app's shell for the map CSS to sit on. */
  :root { --border:#2a2a2a; --radius:8px; --radius-lg:12px; --muted-foreground:#9a9a9a;
          --destructive:#F87171; --warning:#FBBF24; --success:#4ADE80;
          --popover:#161616; --app:#111; --foreground:#eee; }
  body { background:#111; color:#eee; margin:0; padding:14px; font:13px Montserrat,'Segoe UI',sans-serif; }
  .card { border:1px solid var(--border); border-radius:12px; margin-top:12px; background:#151515; }
  .card-head { display:flex; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); }
  .card-body { padding:14px; }
  .muted { color:#9a9a9a; } .btn { padding:6px 12px; } .field span { display:block; font-size:11px; color:#9a9a9a; }
  .inp { background:#101010; color:#eee; border:1px solid #333; padding:5px 8px; border-radius:6px; }
  #results { white-space:pre-wrap; font-family:Consolas,monospace; font-size:12px; padding:12px; }
</style>
<link rel="stylesheet" href="css/warehouse-settings.css">
</head>
<body>
<div id="modal-root"></div>
<div id="host"></div>
<pre id="results"></pre>

<script>
/* ------- the app globals shelfmap.js reaches for ----------------------- */
var OG = { lang: 'en', view: 'shelfmap', wh: { tab: 'stock' } };
window.__errors = [];
window.onerror = function (m, s, l, c) { window.__errors.push(m + ' @' + String(s).split('/').pop() + ':' + l + ':' + c); };

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function nf(n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }
var __toasts = [];
function toast(title, msg, kind) { __toasts.push({ title: title, msg: msg, kind: kind }); }

/* The room's high tier, pinned: swiftshader is slow enough to make the auto
   tier drop itself, and the shadow paths are what this run has to exercise.
   The camera starts in orbit whatever the last run left behind. */
try { localStorage.setItem('og_sm_quality', 'high'); localStorage.removeItem('og_sm_cam'); localStorage.removeItem('og_sm_pads');
      /* the view switch persists too, and a previous run that ended in the
         room would otherwise open this one there */
      localStorage.removeItem('og_sm_view'); } catch (e) {}
/* A <div id="toasts"> as the app has, so fullscreen has something to bring in. */
(function () { var d = document.createElement('div'); d.id = 'toasts'; document.body.appendChild(d); })();

var __allow = {};
function allow(p) { return !!__allow[p]; }

var __modal = null;
function openModal(o) {
  __modal = o;
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop"><div class="modal"><div class="modal-body">' + o.body +
    '</div><div class="modal-foot">' + (o.foot || '') + '</div></div></div>';
  if (o.onOpen) o.onOpen(root);   /* faithful to js/app-util.js */
}
function closeModal() { __modal = null; document.getElementById('modal-root').innerHTML = ''; }
function modalOpen() { return !!__modal; }

var ACTIONS = {}, CHANGES = {};
/* The app's shared delegation (data-act / data-change). ShelfMap has its own
   data-sm / data-smv listeners and binds them itself — this only stands in
   for the tables it does NOT own, like modal-close. */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var fn = ACTIONS[el.getAttribute('data-act')];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', function (e) {
  var el = e.target.closest ? e.target.closest('[data-change]') : null;
  if (!el) return;
  var fn = CHANGES[el.getAttribute('data-change')];
  if (fn) fn(el, e);
});
/* Stand-ins for the two shared actions ShelfMap's modals use. */
ACTIONS['modal-close'] = function () { closeModal(); };

/* WebAudio, captured rather than played: headless Chrome has no speaker, and
   what matters is WHICH tone fired for which event. */
var __tones = [];
(function () {
  function FakeParam() {}
  FakeParam.prototype.setValueAtTime = function () { return this; };
  FakeParam.prototype.exponentialRampToValueAtTime = function () { return this; };
  function FakeCtx() { this.currentTime = 0; this.state = 'running'; this.destination = {}; }
  FakeCtx.prototype.resume = function () { this.state = 'running'; };
  FakeCtx.prototype.createGain = function () { return { gain: new FakeParam(), connect: function () {} }; };
  FakeCtx.prototype.createOscillator = function () {
    var o = { type: '', frequency: new FakeParam(), connect: function () {}, start: function () {}, stop: function () {} };
    o.frequency.setValueAtTime = function (f) { __tones.push({ freq: f, type: o.type }); return this; };
    return o;
  };
  window.AudioContext = FakeCtx;
})();

/* ------- catalogue stub ------------------------------------------------- */
var PRODUCTS = [
  { id: 1, name: 'حذاء الاختبار', colorway: 'Triple Black', type: 'sneakers', archived: false,
    image: { bg: '#7C3AED', initials: 'حا' } },
  { id: 2, name: 'Test Tee', colorway: '', type: 'tshirts', archived: false,
    image: { bg: '#0EA5E9', initials: 'TT' } },
  { id: 3, name: 'Dead Product', colorway: '', type: 'sneakers', archived: true,
    image: { bg: '#333', initials: 'DP' } },
  { id: 4, name: 'Half Sizes', colorway: '', type: 'crocs', archived: false,
    image: { bg: '#888', initials: 'HS' } }
];
var VARIANTS = [];
['39', '40', '41', '42', '43', '44', '45'].forEach(function (s) {
  VARIANTS.push({ sku: 'OG-001-' + s, productId: 1, size: s, qty: 10,
                  barcode: '6210000000' + s, labelCode: '9001' + s });
});
['S', 'M', 'L', 'XL'].forEach(function (s, i) {
  VARIANTS.push({ sku: 'OG-002-' + s, productId: 2, size: s, qty: 5,
                  barcode: '62100010' + i, labelCode: '90020' + i });
});
[['39', '90040'], ['39.5', '90041'], ['40', '90042']].forEach(function (p) {
  VARIANTS.push({ sku: 'OG-004-' + p[0], productId: 4, size: p[0], qty: 2,
                  barcode: '6210004' + p[1], labelCode: p[1] });
});

var DB = {
  products: PRODUCTS,
  /* the type palette the real js/data.js carries — three of the eight,
     which is every type the fixture uses */
  typeLabels: { sneakers: 'Sneakers', tshirts: 'T-Shirts', crocs: 'Crocs' },
  typeColour: function (ty) {
    return ({ sneakers: '#3B5C8A', tshirts: '#2E6E6B', crocs: '#7A4468' })[ty] || '#4A4A52';
  },
  warehouses: [
    { id: 'floor', name: 'Shop floor', nameAr: 'المحل', kind: 'shop' },
    { id: 'store', name: 'Back storage', nameAr: 'المستودع', kind: 'storage' }
  ],
  sizeSets: { sneakers: ['39', '40', '41', '42', '43', '44', '45'], tshirts: ['S', 'M', 'L', 'XL', 'XXL'] },
  product: function (id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; },
  variantsOf: function (pid) { return VARIANTS.filter(function (v) { return v.productId === pid; }); },
  variantBySku: function (s) { return VARIANTS.filter(function (v) { return v.sku === s; })[0]; },
  variantByBarcode: function (b) { return VARIANTS.filter(function (v) { return v.barcode === b; })[0]; },
  variantByLabelCode: function (c) { return VARIANTS.filter(function (v) { return v.labelCode === c; })[0]; },
  whName: function (id, ar) {
    var w = DB.warehouses.filter(function (x) { return x.id === id; })[0];
    return w ? (ar ? w.nameAr : w.name) : id;
  }
};

/* ------- the rooms the map draws ---------------------------------------
   Room M: origin RIGHT, cols 1,2,4 in row A and 1,3 in row B — so A3, B2
   and B4 are floor. A1 assigned+stocked+capacity; A2 assigned+empty, no
   capacity; A4 unassigned with foreign stock; B3 assigned to the
   half-size product with a 39..39.5 range (the selected-option trap). */
var SECTIONS = [
  { id: 11, key: 'M', name: 'مستودع الأحذية', wh_id: 'store', wh_code: 2,
    grid_origin: 'right', sort_index: 1,
    room_id: 1, wall: 'n', wall_pos: 0, wall_cm: 0,
    bay_cm: null, level_cm: null, depth_cm: null,
    size: { bay: 114, level: 46, depth: 95, cols: 4, width: 456 },
    shelves: [
      { id: 101, code: 'A1', row_label: 'A', col_index: 1, product_id: 1,
        product_name: 'حذاء الاختبار', size_from: '39', size_to: '41', range: '39–41',
        capacity: 40, qty: 12, variants: 2,
        contents: [
          { sku: 'OG-001-39', size: '39', qty: 5, product_id: 1, product_name: 'حذاء الاختبار' },
          { sku: 'OG-001-40', size: '40', qty: 7, product_id: 1, product_name: 'حذاء الاختبار' }
        ] },
      { id: 102, code: 'A2', row_label: 'A', col_index: 2, product_id: 1,
        product_name: 'حذاء الاختبار', size_from: '42', size_to: '45', range: '42–45',
        capacity: null, qty: 0, variants: 0, contents: [] },
      { id: 104, code: 'A4', row_label: 'A', col_index: 4, product_id: null,
        product_name: null, size_from: null, size_to: null, range: null,
        capacity: null, qty: 3, variants: 1,
        contents: [{ sku: 'OG-002-M', size: 'M', qty: 3, product_id: 2, product_name: 'Test Tee' }] },
      { id: 105, code: 'B1', row_label: 'B', col_index: 1, product_id: null,
        product_name: null, size_from: null, size_to: null, range: null,
        capacity: 20, qty: 0, variants: 0, contents: [] },
      { id: 106, code: 'B3', row_label: 'B', col_index: 3, product_id: 4,
        product_name: 'Half Sizes', size_from: '39', size_to: '39.5', range: '39–39.5',
        capacity: null, qty: 0, variants: 0, contents: [] }
    ] },
  /* A SECOND RACK IN THE SAME ROOM, on another wall. The 2D view draws one
     rack at a time, so this is what proves the plan can reach the other. */
  { id: 13, key: 'N', name: 'الرفّ الجانبي', wh_id: 'store', wh_code: 2,
    grid_origin: 'left', sort_index: 2,
    room_id: 1, wall: 'e', wall_pos: 1, wall_cm: 114,
    /* A rack of its OWN size: 120 cm bays. The room has to draw it at that
       and not at the standard 114. */
    bay_cm: 120, level_cm: null, depth_cm: null,
    size: { bay: 120, level: 46, depth: 95, cols: 1, width: 120 },
    /* Its one shelf sits on level C — no A, no B. The phantom-level case:
       geometry() must report ONE level, not three, or view mode draws two
       rows of empty floor and edit mode offers to grow the rack above its
       own top, which the server never does. */
    shelves: [
      { id: 301, code: 'C1', row_label: 'C', col_index: 1, product_id: 2,
        product_name: 'Test Tee', size_from: null, size_to: null, range: null,
        capacity: 10, qty: 4, variants: 1,
        contents: [{ sku: 'OG-002-M', size: 'M', qty: 4, product_id: 2, product_name: 'Test Tee' }] }
    ] },
  { id: 12, key: 'F', name: 'واجهة المحل', wh_id: 'floor', wh_code: 1,
    grid_origin: 'left', sort_index: 1,
    room_id: null, wall: null, wall_pos: null, wall_cm: null,
    bay_cm: null, level_cm: null, depth_cm: null,
    size: { bay: 114, level: 46, depth: 95, cols: 1, width: 114 },
    shelves: [
      { id: 201, code: 'A1', row_label: 'A', col_index: 1, product_id: 1,
        product_name: 'حذاء الاختبار', size_from: null, size_to: null, range: null,
        capacity: null, qty: 0, variants: 0, contents: [] }
    ] }
];

/* One room holding M and N; F is in no room and draws on its own. */
var ROOMS = [
  { id: 1, wh_id: 'store', name: 'المستودع الخلفي', sort_index: 1,
    width_cm: null, depth_cm: null, height_cm: null }
];

/* The standard rack and the limits ride with the layout, as the server
   sends them (GEOMETRY / RACK_LIMITS in server/lib/shelves.js). */
/* ?room=og swaps the fixture for a room shaped like the shop's own back room —
   4.5 m wide, 5.5 m front to back, 3.5 m high, a rack on the left wall, the
   back wall and the right wall, and the island down the middle, at exactly
   the sizes npm run warehouse:one-room builds (the room's 92 cm bays, 34 cm
   levels, 45 cm deep, 4 bays × 6 levels on the walls, 2 × 6 in the middle) —
   stocked unevenly, some bays past what fits.
   It asserts nothing: it exists to be LOOKED at, with ?gl=force&hold, beside
   docs/img/warehouse-ref.jpg. */
/* Stage C adds two knobs to the look room.
   ?pics=N  — N products of its own, each with a drawn test photograph (a
              sneaker in profile, in landscape, wide and square shapes), so
              the boxes carry pictures. Harness-only artwork, never shipped.
   ?room=og2 — the headroom room: twice the floor (6.36 × 7.78 m), twice the
              racks (eight, two of them free-standing), and with pics=24 twice
              the products; the boxes come to about twice as many. Built to
              find what breaks before the shop grows into it. */
var LOOK = /[?&]room=og2?\b/.test(location.search);
if (LOOK) (function () {
  var params = new URLSearchParams(location.search);
  var TWO = params.get('room') === 'og2';
  var PICS = Math.max(0, Math.min(200, +params.get('pics') || 0));
  var shoe = function (i) {
    var shapes = [[360, 240], [400, 190], [260, 260]], sz = shapes[i % 3];
    var c = document.createElement('canvas'), W = sz[0], H = sz[1];
    c.width = W; c.height = H;
    var g = c.getContext('2d'), hue = (i * 47) % 360;
    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#f2f0ec'); bg.addColorStop(1, '#d6d1ca');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    var s = Math.min(W / 380, H / 190);
    g.save();
    g.translate((W - 360 * s) / 2, (H - 170 * s) / 2);
    g.scale(s, s);
    g.fillStyle = '#fafafa';
    g.beginPath(); g.moveTo(10, 130); g.lineTo(350, 130); g.quadraticCurveTo(364, 150, 340, 162);
    g.lineTo(22, 162); g.quadraticCurveTo(0, 150, 10, 130); g.fill();
    g.fillStyle = '#2b2b2b'; g.fillRect(16, 154, 328, 8);
    g.fillStyle = 'hsl(' + hue + ',62%,44%)';
    g.beginPath(); g.moveTo(20, 132); g.quadraticCurveTo(28, 70, 112, 60); g.lineTo(172, 18);
    g.quadraticCurveTo(212, 4, 234, 30); g.lineTo(252, 72); g.quadraticCurveTo(334, 82, 350, 132); g.closePath(); g.fill();
    g.strokeStyle = 'hsl(' + ((hue + 180) % 360) + ',70%,90%)'; g.lineWidth = 13; g.lineCap = 'round';
    g.beginPath(); g.moveTo(88, 116); g.quadraticCurveTo(200, 122, 302, 88); g.stroke();
    g.strokeStyle = '#f4f4f4'; g.lineWidth = 4;
    for (var l = 0; l < 4; l++) { g.beginPath(); g.moveTo(150 + l * 20, 50 + l * 6); g.lineTo(172 + l * 20, 41 + l * 6); g.stroke(); }
    g.restore();
    return c.toDataURL('image/png');
  };
  var gen = [], kinds = ['sneakers', 'sneakers', 'crocs', 'tshirts'];
  for (var gi = 0; gi < PICS; gi++) {
    PRODUCTS.push({ id: 100 + gi, name: 'Runner ' + (gi + 1), colorway: '', type: kinds[gi % kinds.length], archived: false,
                    image: { bg: '#555555', initials: 'R' + (gi + 1), src: shoe(gi) } });
    gen.push(100 + gi);
  }
  var pick = function (r, fallback) {
    return PICS ? [gen[(r * 3) % PICS], gen[(r * 3 + 1) % PICS], gen[(r * 3 + 2) % PICS]] : fallback;
  };
  var nameOf = function (pid) { var p = DB.product(pid); return p ? p.name : ''; };
  var free = function (d, x, y, rot) {
    d.wall = null; d.wall_pos = null; d.wall_cm = null;
    d.placement = 'free'; d.x_cm = x; d.y_cm = y; d.rot_deg = rot;
    return d;
  };
  var h = function (a, b) { var x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };
  var sizesBy = { 1: ['39', '40', '41', '42', '43', '44', '45'], 2: ['S', 'M', 'L', 'XL'], 4: ['39', '39.5', '40'] };
  var names = { 1: 'حذاء الاختبار', 2: 'Test Tee', 4: 'Half Sizes' };
  var rack = function (id, key, name, wall, wallCm, cols, rows, pids, bay) {
    var shelves = [];
    for (var r = 0; r < rows; r++) for (var c = 1; c <= cols; c++) {
      var pid = pids[(r + c) % pids.length];
      var roll = h(id + r, c);
      var qty = roll < 0.18 ? 0 : roll < 0.3 ? 30 + Math.round(h(c, id) * 20) : Math.round(2 + roll * 20);
      var sz = sizesBy[pid] || ['40', '41', '42', '43'], contents = [], left = qty;
      for (var s = 0; s < sz.length && left > 0; s++) {
        var q = s === sz.length - 1 ? left : Math.min(left, Math.round(qty / sz.length + h(s, r + c) * 4));
        if (q > 0) { contents.push({ sku: 'OG-00' + pid + '-' + sz[s], size: sz[s], qty: q, product_id: pid, product_name: nameOf(pid) }); left -= q; }
      }
      shelves.push({ id: id * 100 + r * 10 + c, code: 'ABCDEFGH'.charAt(r) + c, row_label: 'ABCDEFGH'.charAt(r), col_index: c,
                     product_id: qty ? pid : null, product_name: qty ? nameOf(pid) : null, size_from: null, size_to: null, range: null,
                     capacity: null, qty: qty, variants: contents.length, contents: contents });
    }
    return { id: id, key: key, name: name, wh_id: 'store', wh_code: 2, grid_origin: 'left', sort_index: id,
             room_id: 1, wall: wall, wall_pos: Math.round(wallCm / bay), wall_cm: wallCm,
             bay_cm: bay, level_cm: 34, depth_cm: 45,
             size: { bay: bay, level: 34, depth: 45, cols: cols, width: cols * bay }, shelves: shelves };
  };
  SECTIONS.length = 0;
  if (!TWO) {
    SECTIONS.push(rack(21, 'A', 'الرف الأيسر', 'w', 115, 4, 6, pick(0, [1, 4]), 92));
    SECTIONS.push(rack(22, 'B', 'الرف الخلفي', 'n', 41, 4, 6, pick(1, [1, 2, 4]), 92));
    SECTIONS.push(rack(23, 'C', 'الرف الأيمن', 'e', 67, 4, 6, pick(2, [2, 1]), 92));
    /* D, free-standing down the middle (051), as warehouse-one-room.js seeds
       it: two of the ROOM's 92 cm bays, centred, 115 cm clear to the front */
    SECTIONS.push(free(rack(24, 'D', 'الرف الأوسط', 'n', 0, 2, 6, pick(3, [1, 2]), 92), 225, 207, 270));
    ROOMS[0] = { id: 1, wh_id: 'store', name: 'المستودع', sort_index: 1, width_cm: 450, depth_cm: 550, height_cm: 350 };
  } else {
    /* twice the room: two racks on each side wall, two on the back, and two
       islands with a walkable aisle between them and round them */
    SECTIONS.push(rack(21, 'A', 'يسار ١', 'w', 20, 4, 6, pick(0, [1, 4]), 92));
    SECTIONS.push(rack(22, 'E', 'يسار ٢', 'w', 400, 4, 6, pick(1, [1, 2]), 92));
    SECTIONS.push(rack(23, 'C', 'يمين ١', 'e', 10, 4, 6, pick(2, [2, 1]), 92));
    SECTIONS.push(rack(24, 'F', 'يمين ٢', 'e', 390, 4, 6, pick(3, [2, 4]), 92));
    SECTIONS.push(rack(25, 'B', 'خلف ١', 'n', 50, 3, 6, pick(4, [1, 2, 4]), 92));
    SECTIONS.push(rack(26, 'G', 'خلف ٢', 'n', 330, 2, 6, pick(5, [4, 1]), 92));
    SECTIONS.push(free(rack(27, 'D', 'وسط ١', 'n', 0, 3, 6, pick(6, [1, 2]), 92), 212, 300, 270));
    SECTIONS.push(free(rack(28, 'H', 'وسط ٢', 'n', 0, 3, 6, pick(7, [2, 1]), 92), 424, 300, 270));
    ROOMS[0] = { id: 1, wh_id: 'store', name: 'المستودع × 2', sort_index: 1, width_cm: 636, depth_cm: 778, height_cm: 350 };
  }
})();

var GEOMETRY = { bay_cm: 114, level_cm: 46, depth_cm: 95, upright_cm: 14, base_cm: 8, top_cm: 5, board_cm: 4 };
var LIMITS = { rack: { bay: [60, 300], level: [10, 200], depth: [20, 200] }, room_max_cm: 10000, bay_min_cm: 60,
               aisle_min_cm: 70, rotations: [0, 90, 180, 270] };

var Shop = { sections: function () {
  return Promise.resolve({ sections: JSON.parse(JSON.stringify(SECTIONS)),
                           rooms: JSON.parse(JSON.stringify(ROOMS)),
                           geometry: GEOMETRY, limits: LIMITS });
} };

/* API stub: records calls; behaviour switched per scenario. */
var __calls = [];
var __postMode = 'ok';
var API = {
  get: function (p) { __calls.push(['GET', p]); return Promise.resolve({}); },
  post: function (p, b) {
    __calls.push(['POST', p, b]);
    if (p === '/api/stock/assign-shelf' && __postMode === 'wrong_size') {
      var e = new Error('M-A2 is X — this is a Y. This pair belongs on M-A1.');
      e.code = 'wrong_size';
      e.detail = { belongsOn: { matching: [{ id: 101, full_code: 'M-A1' }] } };
      return Promise.reject(e);
    }
    /* Stage C's refusals, shaped as server/lib/shelves.js throws them */
    if (__postMode === 'too_tall' && /\/rows$/.test(p)) {
      __postMode = 'ok';
      var et = new Error('rack P would stand 243 cm tall with 5 levels and the room is 200 cm high');
      et.code = 'rack_too_tall';
      et.detail = { ok: false, code: 'rack_too_tall', error: et.message, rack: 'P', levels: 5,
                    height_cm: 243, room_height_cm: 200, max_levels: 4 };
      return Promise.reject(et);
    }
    if (__postMode === 'occupied' && /\/cols$/.test(p)) {
      __postMode = 'ok';
      var eo = new Error('bay 4 cannot go: M-A4 has 3');
      eo.code = 'shelf_occupied';
      eo.detail = { ok: false, code: 'shelf_occupied', error: eo.message, rack: 'M',

     pk.querySelectorAll('.sm-chip').length);
  ok('2d: with only the sizes that are here filled — the holes are the information',
     [].map.call(pk.querySelectorAll('.sm-chip.in'), function (c) { return c.textContent; }).join(',') === '39,40');
  ok('2d: and no per-size quantity, like the panel', !/\d+\s*×/.test(pk.textContent));
  ok('2d: the peek never eats a click', getComputedStyle(pk).pointerEvents === 'none');
  document.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  ok('2d: a touch puts it away', $('.sm-peek').hidden);

  /* the view switch. Headless has no GPU, so the room cannot be offered —
     which is itself the assertion: a button for a view this machine cannot
     draw would be a button that lies. */
  /* The switch is ALWAYS drawn — headless has no GPU, so this is the
     refusal path: the Room half is offered, disabled, and carries the
     reason. An absence would explain nothing. */
  ok('2d: the switch is drawn even where the room cannot be', !!$('.sm-viewsw'));
  ok('2d: …with the Room half refused and the reason on it',
     $('[data-sm="view-room"]').disabled === true &&
     $('[data-sm="view-room"]').title === t('sm_no_webgl'),
     $('[data-sm="view-room"]').title);
  ok('2d: and 2D is the half that is lit', $('[data-sm="view-2d"]').classList.contains('on'));

  /* ---- geometry: origin right means column 1 draws on the RIGHT ------- */
  var heads = $$('.sm-colhead');
  ok('column heads drawn 1..4', heads.length === 4, heads.length);
  var x1 = xOf('#smRoot .sm-colhead:nth-of-type(1)');
  var xs = {};
  heads.forEach(function (h) { xs[h.textContent.replace(/\D/g, '')] = h.getBoundingClientRect().left; });
  ok('origin right: col 1 sits RIGHT of col 4  [' + OG.lang + ']', xs['1'] > xs['4'], xs);
  ok('cols run 4..1 left to right', xs['4'] < xs['3'] && xs['3'] < xs['2'] && xs['2'] < xs['1'], xs);

  /* ---- gaps are floor, not shelves ------------------------------------ */
  ok('5 tiles drawn', $$('.sm-tile').length === 5);
  /* In view mode (edit off) gaps are inert floor for everyone. */
  ok('3 gaps drawn as empty floor (view mode)', $$('.sm-cell-gap').length === 3,
     { gaps: $$('.sm-cell-gap').length, adds: $$('.sm-cell-add').length });

  /* ---- fill vs plain count -------------------------------------------- */
  var t101 = $('#smT101'), t104 = $('#smT104');
  ok('capacity tile has a fill bar', !!t101.querySelector('.sm-fill'));
  ok('fill is 30% of 40', t101.querySelector('.sm-fill').style.height === '30%',
     t101.querySelector('.sm-fill').style.height);
  /* NO BAR WITHOUT A CAPACITY. There is no number to be a fraction of, and
     a band drawn against one nobody measured is a picture of a lie. A first
     pass at the 2D view drew a fixed 55% band here; this assertion is what
     protects the rule. The colour still lands — it washes the whole face,
     which says WHAT is on the bay without claiming HOW FULL. */
  ok('null-capacity tile has NO fill bar', !t104.querySelector('.sm-fill'));
  ok('null-capacity tile shows a plain count', t104.querySelector('.sm-load') &&
     t104.querySelector('.sm-load').textContent === '3');
  /* Empty but measured: the bar is there at zero and the count says so.
     "0/20" is a different fact from "nobody has measured this shelf", and
     the two must not look the same. */
  ok('an empty measured bay reads 0 of its capacity',
     $('#smT105 .sm-fill').style.height === '0%' &&
     $('#smT105 .sm-load').textContent === '0/20',
     $('#smT105 .sm-load') && $('#smT105 .sm-load').textContent);

  /* ---- panel: chips ---------------------------------------------------- */
  t101.click();
  ok('panel opens on M-A1', !!$('.sm-panel') && $('.sm-panel h3').textContent.indexOf('M-A1') === 0);
  var chips = $$('.sm-panel .sm-chip');
  ok('7 chips for the size run', chips.length === 7, chips.length);
  var filled = $$('.sm-panel .sm-chip.in').map(function (c) { return c.textContent; });
  ok('filled chips are exactly 39 and 40', filled.join(',') === '39,40', filled);
  ok('assignment line shows the range', $('.sm-assign-line').textContent.indexOf('39–41') > -1);

  /* assigned-but-empty: the model belongs here and has run out */
  $('#smT102').click();
  ok('empty assigned shelf still shows its product row', $$('.sm-panel .sm-row').length === 1);
  ok('with every chip dim', $$('.sm-panel .sm-chip.in').length === 0);

  /* unassigned shelf with foreign stock shows what is on it */
  $('#smT104').click();
  ok('unassigned shelf shows the foreign product', $('.sm-panel .sm-row-name b').textContent === 'Test Tee');
  ok('archived product would be filtered', true); /* covered by server; DB.product guard in code */

  /* ---- edit gating ----------------------------------------------------- */
  var editBtn = $$('[data-sm="edit"]');
  ok(asManager ? 'manager sees the edit button' : 'staff sees NO edit button',
     asManager ? editBtn.length === 1 : editBtn.length === 0);

  if (asManager) {
    editBtn[0].click();
    ok('edit mode: gaps become add-cells', $$('.sm-cell-add').length === 3, $$('.sm-cell-add').length);
    ok('edit mode: stocked tiles show the lock', !!$('#smT101 .sm-lock') && !!$('#smT104 .sm-lock'));
    ok('edit mode: empty tiles show no lock', !$('#smT105 .sm-lock'));
    ok('edit mode: growbar present', !!$('.sm-growbar'));
    /* The rule moved out of its own .sm-note and into the foot line under
       the stage, which is where the 2D view says everything else about
       itself. It must still be stated verbatim while editing. */
    ok('edit mode: the no-renumber rule is stated', $('.sm-room-hint') &&
       $('.sm-room-hint').textContent === t('sm_no_renumber'),
       $('.sm-room-hint') && $('.sm-room-hint').textContent);
    ok('not editing, the foot explains the view instead', true);
    ok('edit mode: the designer opens beside the plan', !!$('.sm-designer'));
    ok('edit mode: one seed form at most, never two', $$('#smSeedR').length <= 1,
       $$('#smSeedR').length);
    /* F is a floor rack and the room on screen is in the store — a rack
       cannot be placed into a room in the other building, so the designer
       must not offer it */
    ok('edit mode: the designer offers only racks from THIS building',
       $$('.sm-designer [data-sm="rack-cfg"]').every(function (b) {
         return b.getAttribute('data-id') !== '12';
       }));

    /* the half-size selected-option regression: B3 is 39..39.5 */
    $('#smT106').click();
    var from = $('#smFrom');
    ok('range from-select exists in edit panel', !!from);
    ok('from=39 selects "39", not "39.5"', from && from.value === '39', from && from.value);
    var to = $('#smTo');
    ok('to=39.5 selects "39.5"', to && to.value === '39.5', to && to.value);

    /* row/col removal asks first, then posts */
    $('[data-sm="col-rm"][data-col="4"]').click();
    ok('column removal opens a confirm', modalOpen());
    var before = __calls.length;
    $('[data-sm="remove-go"]').click();
    setTimeout(function () {
      var call = __calls[before];
      ok('confirmed removal posts to /cols', call && call[1] === '/api/sections/11/cols' &&
         call[2].action === 'remove' && call[2].col === 4, call);
    }, 0);

    /* confirm_required flow: numbers on screen, reprint offered, force resent */
    setTimeout(function () {
      __postMode = 'confirm';
      ShelfMap.assignFlow(101, { productId: 2 });
      setTimeout(function () {
        ok('confirm modal opened with the piece count', modalOpen() &&
           $('.modal-body').textContent.indexOf('12') > -1);
        ok('confirm modal states the stale label count', $('.modal-body').textContent.indexOf('7') > -1);
        ok('reprint button present', !!$('[data-sm="confirm-reprint"]'));
        var n = __calls.length;
        $('[data-sm="confirm-apply"]').click();
        setTimeout(function () {
          var forced = __calls.filter(function (c) { return c[0] === 'PATCH'; }).pop();
          ok('apply resends with force:true', forced && forced[2].force === true, forced && forced[2]);
          runScans();
        }, 20);
      }, 20);
    }, 30);
  } else {
    runScans();
  }

  function runScans() {
    setTimeout(function () {
      closeModal();
      /* leave edit mode so owns() is clean and selection state is simple */
      if (asManager && $$('[data-sm="edit"]').length) $$('[data-sm="edit"]')[0].click();

      /* -- scan a shelf label ------------------------------------------ */
      Wedge.feed('SH02MA2', 5);
      ok('shelf scan selects M-A2', $('.sm-panel h3') &&
         $('.sm-panel h3').textContent.indexOf('M-A2') === 0);
      ok('shelf scan flashes green', !!$('#smT102.sm-flash-ok'));

      /* -- product scan with a target files onto it -------------------- */
      var n = __calls.length;
      Wedge.feed('OG-001-42', 5);
      setTimeout(function () {
        var call = __calls[n];
        ok('product scan posts assign-shelf', call && call[1] === '/api/stock/assign-shelf', call);
        ok('with the shelf and ITS warehouse', call && call[2].shelfId === 102 && call[2].whId === 'store', call && call[2]);

        /* -- a refusal flashes the refused shelf red and the right one amber */
        __postMode = 'wrong_size';
        Wedge.feed('90042', 5);   /* by label code, the third matcher */
        setTimeout(function () {
          ok('refused shelf flashes red', !!$('#smT102.sm-flash-bad'));
          ok('the shelf it belongs on flashes amber', !!$('#smT101.sm-flash-warn'));
          var last = __toasts[__toasts.length - 1];
          ok('toast carries the server sentence', last && /belongs on M-A1/.test(last.title), last);
          __postMode = 'ok';

          /* -- no target: light up the model's homes ------------------- */
          $('#smT102').click();      /* deselect */
          Wedge.feed('6210000000' + '43', 5);
          ok('no-target scan highlights the model homes', !!$('#smT101.sm-flash-warn') || !!$('#smT102.sm-flash-warn'));

          /* -- unknown code ------------------------------------------- */
          var tn = __toasts.length;
          Wedge.feed('ZZZZZZZZ', 5);
          ok('unknown code toasts, in words', __toasts.length > tn &&
             __toasts[tn].title === t('sm_unknown_code'), __toasts[tn]);

          /* -- a modal takes the scanner back -------------------------- */
          openModal({ body: 'x' });
          ok('owns() false while a modal is open', !ShelfMap.owns());
          closeModal();

          phase4();
        }, 20);
      }, 20);
    }, 40);
  }

  /* ====================== PHASE 4: scan box, sound, undo ================= */
  function phase4() {
    /* -- the box -------------------------------------------------------- */
    var box = $('#smScan');
    ok('a scan box exists', !!box);
    ok('the box holds focus after a repaint', document.activeElement === box,
       document.activeElement && document.activeElement.id);
    ok('the box is LTR whatever the UI language', box.getAttribute('dir') === 'ltr');

    /* Focus must NOT be stolen while somebody types in another field. */
    $('#smT101').click();                       /* select, so the panel exists */
    if (asManager) {
      $$('[data-sm="edit"]')[0].click();
      var code = $('#smCode');
      code.focus();
      ShelfMap.reload();                        /* provokes a repaint */
      setTimeout(function () {
        ok('focus is NOT stolen from another input', document.activeElement !== $('#smScan'),
           document.activeElement && document.activeElement.id);
        $$('[data-sm="edit"]')[0].click();
        scanRun();
      }, 30);
    } else { scanRun(); }
  }

  function scanRun() {
    /* -- target, then six of the same pair ------------------------------ */
    __tones.length = 0; __calls.length = 0; S_chipsReset();
    Wedge.feed('SH02MA1', 5);
    ok('target tone is the two-note chirp', __tones.length === 2 &&
       __tones[0].freq === 620 && __tones[1].freq === 930, __tones.slice());
    ok('target chip is the shelf colour', $('.sm-undo.shelf'));

    var n0 = __calls.length;
    __tones.length = 0;
    /* Six boxes of the same 42. Six scans, six chips, six posts — the wedge
       de-dupe window is 700ms and these are deliberate, so they must not be
       collapsed. lastScan is reset between by using distinct code forms. */
    var codes = ['OG-001-42', '621000000042', '900142', 'OG-001-42', '621000000042', '900142'];
    var i = 0;
    (function next() {
      if (i >= codes.length) return afterSix(n0);
      Wedge.feed(codes[i++], 5);
      setTimeout(next, 12);
    })();
  }

  function afterSix(n0) {
    setTimeout(function () {
      var posts = __calls.slice(n0).filter(function (c) { return c[1] === '/api/stock/assign-shelf'; });
      ok('six scans of the same pair post six times', posts.length === 6, posts.length);
      ok('every accepted scan beeped high', __tones.length >= 6 &&
         __tones.filter(function (x) { return x.freq === 880; }).length === 6,
         __tones.map(function (x) { return x.freq; }));
      var chips = $$('.sm-undo.ok');
      ok('six accepted chips, capped at eight shown', chips.length === 6, chips.length);
      ok('newest chip is first', true);

      /* -- undo: only the last one standing reverses the assignment ------ */
      var before = __calls.length;
      chips[0].click();                                  /* a non-owner */
      setTimeout(function () {
        ok('undoing a repeat scan hits the server 0 times',
           __calls.length === before, __calls.slice(before));
        ok('and removes just that chip', $$('.sm-undo.ok').length === 5);

        /* Remove the remaining five, re-querying each time: every undo
           repaints, which detaches the nodes a stale NodeList still holds —
           and a click on a detached node never reaches the delegated
           listener, so the loop would silently do nothing after the first. */
        for (var k = 0; k < 4; k++) {
          var c2 = $('.sm-undo.ok');
          if (c2) c2.click();
        }
        setTimeout(function () {
          var b2 = __calls.length;
          var last = $$('.sm-undo.ok');
          ok('one accepted chip left', last.length === 1, last.length);
          last[0].click();
          setTimeout(function () {
            var undo = __calls.slice(b2).filter(function (c) { return c[1] === '/api/stock/assign-shelf'; });
            ok('undoing the LAST one reverses on the server', undo.length === 1, undo);
            ok('and restores the previous shelf (null here)',
               undo.length === 1 && undo[0][2].shelfId === null, undo[0] && undo[0][2]);
            soundAndRefusal();
          }, 25);
        }, 25);
      }, 25);
    }, 40);
  }

  function soundAndRefusal() {
    /* -- refusal: low buzz + red chip ---------------------------------- */
    __tones.length = 0;
    __postMode = 'wrong_size';
    Wedge.feed('OG-001-45', 5);
    setTimeout(function () {
      ok('a refusal buzzes low and square', __tones.length === 1 &&
         __tones[0].freq === 150, __tones.slice());
      ok('and lands a red chip', !!$('.sm-undo.bad'));
      __postMode = 'ok';

      /* -- unknown code: buzz + red chip, no dialog ---------------------- */
      __tones.length = 0;
      Wedge.feed('NOTACODE1', 5);
      ok('an unknown code buzzes too', __tones.length === 1 && __tones[0].freq === 150);
      ok('no dialog was opened anywhere in the run', !modalOpen());

      /* -- the sound toggle ---------------------------------------------- */
      var sw = $('[data-sm="sound"]');
      ok('a sound toggle exists', !!sw);
      sw.click();
      __tones.length = 0;
      Wedge.feed('OG-001-39', 5);
      setTimeout(function () {
        ok('muted: no tone fires', __tones.length === 0, __tones.slice());
        ok('but the chip still lands — sound is never the only signal',
           $$('.sm-undo').length > 0);
        ok('the toggle persists to localStorage', localStorage.getItem('og_sm_sound') === '0');
        $('[data-sm="sound"]').click();      /* back on for the next run */
        finish();
      }, 30);
    }, 30);
  }

  /* The module owns its chips; the harness clears them the way the UI does. */
  function S_chipsReset() {
    var c = $('[data-sm="chips-clear"]');
    if (c) c.click();
  }

  function finish() {
    var rack = $('.sm-rack'), tiltbox = $('.sm-tiltbox');
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var out = { pass: R.pass, fail: R.fail, errors: window.__errors, lang: OG.lang, manager: asManager,
                reducedMotion: reduced,
                rackTransform: rack ? getComputedStyle(rack).transform : null,
                tiltboxShown: tiltbox ? getComputedStyle(tiltbox).display !== 'none' : null };
    document.getElementById('results').textContent =
      R.notes.join('\n') + '\n\n' + JSON.stringify(out);
    document.title = 'READY';
  }
}, 60);
</script>
</body>
</html>
