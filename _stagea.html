<!doctype html><meta charset="utf-8"><title>Stage A</title>
<script src="js/codes.js"></script>
<script src="js/data.js"></script>
<pre id="r">running</pre>
<script>
(function () {
  var R = [];
  function ok(n, c, x) { R.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && x !== null ? ' — ' + x : '')); }
  function sum(a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); }

  try {
    /* ---------------------------------------------------------- kit totals */
    var kits = DB.printJobs.filter(function (j) { return j.kind === 'kit'; });
    ok('kit jobs seeded', kits.length === 8, kits.length + ' kit jobs');

    ok('qty === sum(line.qty)', kits.every(function (j) {
      return j.qty === sum(j.lines, function (l) { return l.qty; });
    }));
    ok('cost === sum(qty*price)', kits.every(function (j) {
      return j.cost === sum(j.lines, function (l) { return l.qty * l.price; });
    }));
    ok('cost === DB.jobKitTotal', kits.every(function (j) { return j.cost === DB.jobKitTotal(j); }));

    ok('sizes sum to qty (ALL jobs)', DB.printJobs.every(function (j) {
      var s = 0; for (var k in j.sizes) s += j.sizes[k];
      return s === j.qty;
    }));
    ok('size keys in S-M-L-XL order', kits.every(function (j) {
      var ks = Object.keys(j.sizes), order = ['S', 'M', 'L', 'XL', 'XXL'], last = -1;
      return ks.every(function (k) { var i = order.indexOf(k); if (i <= last) return false; last = i; return true; });
    }));
    ok('bulk jobs have no lines', DB.printJobs.filter(function (j) { return j.kind === 'bulk'; })
       .every(function (j) { return !j.lines; }));

    /* ----------------------------------------------------------------- TBC */
    ok('P-1043 has 5 TBC pieces', DB.tbcCount(DB.job('P-1043')) === 5, DB.tbcCount(DB.job('P-1043')));
    ok('P-1047 has 3 TBC pieces', DB.tbcCount(DB.job('P-1047')) === 3, DB.tbcCount(DB.job('P-1047')));
    ok('TBC counts pieces not lines',
       DB.tbcLines(DB.job('P-1047')).length === 2 && DB.tbcCount(DB.job('P-1047')) === 3);
    ok('no job past Sent carries TBC', DB.printJobs.every(function (j) {
      return DB.printStages.indexOf(j.stage) <= DB.printStages.indexOf('sent') || DB.tbcCount(j) === 0;
    }));
    ok('bulk job never blocked', DB.blockedBy(DB.job('P-1046'), 'done') === null);
    ok('blockedBy reports tbc', DB.blockedBy(DB.job('P-1043'), 'printing') === 'tbc');

    /* ------------------------------------------------------- the TBC gate */
    var j43 = DB.job('P-1043');
    ok('gate blocks printing', DB.setStage(j43, 'printing') === false && j43.stage === 'sent');
    ok('gate allows sideways to design', DB.setStage(j43, 'design') === true && j43.stage === 'design');
    DB.setStage(j43, 'sent');
    ok('restored to sent', j43.stage === 'sent');

    var tbc = DB.tbcLines(j43).slice();
    tbc.forEach(function (l, i) { DB.confirmName('P-1043', l.id, 'PLAYER ' + i, 90 + i); });
    ok('confirmName clears TBC', DB.tbcCount(j43) === 0);
    ok('gate opens once confirmed', DB.setStage(j43, 'printing') === true);
    DB.setStage(j43, 'sent');
    tbc.forEach(function (l) { l.print = null; l.number = null; });   // restore the demo state
    ok('TBC restored for the demo', DB.tbcCount(j43) === 5 && j43.stage === 'sent');

    /* -------------------------------------------------- access boundary */
    var leak = [];
    DB.printJobs.forEach(function (j) {
      var s = JSON.stringify(DB.partnerView(j));
      if (j.customer && s.indexOf(j.customer) > -1) leak.push(j.id + ':customer');
      if (j.phone && s.indexOf(j.phone) > -1) leak.push(j.id + ':phone');
      if (s.indexOf('"price":' + j.price) > -1) leak.push(j.id + ':price');
    });
    ok('partnerView leaks nothing, with kit lines present', leak.length === 0, leak.join(' '));
    ok('partnerView carries lines + tbc', (function () {
      var pv = DB.partnerView(DB.job('P-1043'));
      return pv.lines && pv.lines.length === 18 && pv.tbc === 5 && pv.kind === 'kit';
    })());

    /* ------------------------------------------------------------ invoices */
    ok('4 invoices seeded', DB.partnerInvoices.length === 4);
    var byId = {};
    DB.partnerInvoices.forEach(function (i) { byId[i.id] = i; });

    ok('011 paid',  DB.invoiceStatus(byId['YW-2026-011']) === 'paid', DB.invoiceStatus(byId['YW-2026-011']));
    ok('012 paid',  DB.invoiceStatus(byId['YW-2026-012']) === 'paid');
    ok('013 sent',  DB.invoiceStatus(byId['YW-2026-013']) === 'sent');
    ok('014 part',  DB.invoiceStatus(byId['YW-2026-014']) === 'part');
    ok('013 overdue', DB.invoiceOverdue(byId['YW-2026-013']) === true);
    ok('014 not overdue', DB.invoiceOverdue(byId['YW-2026-014']) === false);

    ok('011 total = 16 kits x 18000', DB.invoiceTotal(byId['YW-2026-011']) === 16 * 18000,
       DB.invoiceTotal(byId['YW-2026-011']));
    ok('011 pieces = 16', DB.invoicePieces(byId['YW-2026-011']) === 16);
    ok('014 is a whole bulk job', DB.invoiceLines(byId['YW-2026-014']).length === 1 &&
       DB.invoiceTotal(byId['YW-2026-014']) === DB.job('P-1037').cost);
    ok('balance = total - paid', DB.partnerInvoices.every(function (i) {
      return DB.invoiceBalance(i) === Math.max(0, DB.invoiceTotal(i) - DB.invoicePaid(i));
    }));

    var age = DB.invoiceAgeing(), ageSum = sum(age, function (b) { return b.value; });
    ok('ageing sums to outstanding', ageSum === DB.outstandingTotal(),
       ageSum + ' vs ' + DB.outstandingTotal());
    ok('outstanding = 126,000 + 912,500', DB.outstandingTotal() === 126000 + 912500,
       DB.outstandingTotal());
    ok('013 lands in 31-60 bucket', age[2].value === 126000, JSON.stringify(age.map(function (b) { return b.key + ':' + b.value; })));
    ok('paid this month = 1,000,000', DB.paidInMonth(0) === 1000000, DB.paidInMonth(0));
    ok('avg days to pay is a number', typeof DB.avgDaysToPay() === 'number', DB.avgDaysToPay() + ' d');

    /* ------------------------------------------------------------ unbilled */
    var un = DB.unbilledRefs();
    ok('unbilled = P-1036 + P-1038 lines', un.length === 15, un.length + ' refs');
    ok('unbilled only from done jobs', un.every(function (r) { return DB.job(r.jobId).stage === 'done'; }));
    ok('unbilled total = 324,000', DB.unbilledTotal() === (12 + 6) * 18000, DB.unbilledTotal());
    ok('billed lines excluded', un.every(function (r) { return r.jobId !== 'P-1030' && r.jobId !== 'P-1037'; }));

    /* ------------------------------------------------- create / issue / pay */
    ok('next id is YW-2026-015', DB.nextPartnerInvoiceId() === 'YW-2026-015', DB.nextPartnerInvoiceId());
    var inv = DB.newInvoice(un.slice(0, 12), 'test');
    ok('new invoice is a draft', DB.invoiceStatus(inv) === 'draft' && inv.issued === null);
    ok('draft excluded from outstanding', DB.outstandingTotal() === 126000 + 912500);
    /* 12 REFS, not 12 kits — a line can carry two shirts, so the money has to
       be checked against the pieces the refs actually resolve to. */
    var draftTotal = DB.invoiceTotal(inv), draftPcs = DB.invoicePieces(inv);
    ok('draft total = pieces x price', draftTotal === draftPcs * 18000, draftPcs + ' pcs = ' + draftTotal);
    ok('draft carries 12 refs', inv.refs.length === 12 && draftPcs > 12, draftPcs + ' pcs from 12 lines');
    ok('unbilled shrank by exactly 12', DB.unbilledRefs().length === 3, DB.unbilledRefs().length);

    ok('issue sets due date', DB.issueInvoice(inv) === true && !!inv.due);
    ok('cannot issue twice', DB.issueInvoice(inv) === false);
    ok('now sent', DB.invoiceStatus(inv) === 'sent');
    ok('overpayment refused', DB.payInvoice(inv, draftTotal + 1, 'cash') === false);
    ok('zero payment refused', DB.payInvoice(inv, 0, 'cash') === false);
    ok('part payment', DB.payInvoice(inv, 100000, 'cash') === true && DB.invoiceStatus(inv) === 'part');
    ok('balance after part', DB.invoiceBalance(inv) === draftTotal - 100000);
    ok('settle', DB.payInvoice(inv, draftTotal - 100000, 'sham') === true && DB.invoiceStatus(inv) === 'paid');
    ok('nothing left to pay', DB.payInvoice(inv, 1, 'cash') === false);

    DB.partnerInvoices.shift();                       // restore the demo state
    ok('demo state restored', DB.partnerInvoices.length === 4 && DB.unbilledRefs().length === 15);

    /* ------------------------------------------------------------ messages */
    ok('7 messages seeded', DB.jobMessages.length === 7, DB.jobMessages.length);
    ok('OG has 4 unread', DB.unreadFor('og').length === 4, DB.unreadFor('og').length);
    ok('Yalla has 1 unread', DB.unreadFor('yalla').length === 1, DB.unreadFor('yalla').length);
    ok('sender always read own', DB.jobMessages.every(function (m) {
      return m.from === 'og' ? m.readOg : m.readYl;
    }));

    var ogBefore = DB.unreadFor('og').length;
    var posted = DB.postMessage({ jobId: 'P-1040', from: 'og', kind: 'nudge', text: 'hurry' });
    ok('post from OG raises Yalla only',
       DB.unreadFor('yalla').length === 2 && DB.unreadFor('og').length === ogBefore);
    ok('thread resolves', DB.messagesFor({ jobId: 'P-1043' }).length === 2);
    ok('invoice thread resolves', DB.messagesFor({ invoiceId: 'YW-2026-013' }).length === 1);
    ok('unreadOnJob scoped', DB.unreadOnJob('yalla', 'P-1040') === 1 && DB.unreadOnJob('yalla', 'P-1043') === 0);

    DB.markRead('yalla', { jobId: 'P-1040' });
    ok('markRead one side, one job',
       DB.unreadOnJob('yalla', 'P-1040') === 0 && DB.unreadFor('og').length === ogBefore);
    DB.jobMessages.pop();
    ok('messages restored', DB.jobMessages.length === 7);

    /* ---------------------------------------------------------- scorecard */
    /* Not just "is a number" — a flat 0% or a flat 100% both mean the history
       generator is stamping every job at the same moment relative to its
       deadline, which is exactly the bug this caught the first time. */
    ok('on-time rate is realistic', DB.onTimeRate() > 0 && DB.onTimeRate() < 100, DB.onTimeRate() + '%');
    ok('avg turnaround is plausible', DB.avgTurnaround() > 0 && DB.avgTurnaround() < 40, DB.avgTurnaround() + ' d');
    ok('done jobs stamped at their deadline, not today',
       DB.printJobs.filter(function (j) { return j.stage === 'done'; }).every(function (j) {
         return DB.daysSince(DB.stageAt(j, 'done')) > 0;
       }));

    /* -------------------------------------------------------- regressions */
    ok('nextPrintId still works', DB.nextPrintId() === 'P-1048', DB.nextPrintId());
    ok('sales nextInvoiceId not clobbered', /^INV-\d+$/.test(DB.nextInvoiceId()), DB.nextInvoiceId());
    ok('>=2 overdue jobs', DB.printJobs.filter(function (j) { return DB.isOverdue(j); }).length >= 2);
    ok('every job has history', DB.printJobs.every(function (j) { return !!j.history; }));
  } catch (e) {
    R.push('THROW — ' + e.message + ' | ' + (e.stack || '').split('\n')[1]);
  }

  var fails = R.filter(function (x) { return x.indexOf('PASS') !== 0; });
  document.getElementById('r').textContent =
    '=== ' + (R.length - fails.length) + '/' + R.length + ' passed ===\n\n' +
    (fails.length ? fails.join('\n') + '\n\n---\n' : '') + R.join('\n');
})();
</script>
