<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>receipt check</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- The shell app.js expects. Same trick _shot.html uses: load the app WITHOUT
     api.js and auth.js, so boot() runs straight away in demo mode instead of
     waiting for a login. No iframe — the server sends X-Frame-Options: DENY,
     and that header is right, so the test works around it rather than the
     other way round. -->
<aside id="sidebar"></aside><header id="topbar"></header>
<main id="view"></main><nav id="tabbar"></nav>
<button id="tourBtn"><span id="tourBtnLabel"></span></button>
<div id="modal-root"></div><div id="drawer-root"></div><div id="toasts"></div>

<pre id="out" style="position:fixed;inset:0 0 auto auto;width:46vw;height:100vh;overflow:auto;
  margin:0;padding:14px;background:#000;color:#0F0;font:11px/1.45 Menlo,Consolas,monospace;
  z-index:9999;white-space:pre-wrap">running…</pre>

<script src="js/vendor/chart.umd.min.js"></script>
<script src="js/codes.js"></script><script src="js/motion.js"></script><script src="js/export.js"></script><script src="js/data.js"></script><script src="js/charts.js"></script>
<script src="js/pos.js"></script><script src="js/bulk.js"></script><script src="js/scan.js"></script><script src="js/wedge.js"></script><script src="js/stock.js"></script><script src="js/money.js"></script><script src="js/palette.js"></script><script src="js/whatsapp.js"></script><script src="js/notify.js"></script><script src="js/ylinvoice.js"></script><script src="js/yalla.js"></script><script src="js/deliveries.js"></script><script src="js/app.js"></script>

<script>
/* Throwaway. Renders the receipt the till prints and MEASURES it.

   Measuring is the point. A screenshot cannot tell you whether 70mm of content
   landed inside 80mm of paper, and that is the whole feature.
   getBoundingClientRect returns CSS pixels, where 96px is exactly one inch by
   definition — so px / 96 * 25.4 is real millimetres in any browser, whatever
   the actual monitor is doing. */
var L = [];
function say(s) { L.push(s); document.getElementById('out').textContent = L.join('\n'); }
var errs = [];
window.addEventListener('error', function (e) { errs.push(e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno); });

var mm = function (px) { return (px / 96 * 25.4).toFixed(2); };

function sample(lang) {
  return {
    id: 'INV-2199',
    date: new Date(),
    customerId: DB.customers[0] ? DB.customers[0].id : null,
    customerName: DB.customers[0] ? DB.customers[0].name : 'Walk-in',
    items: [
      { sku: 'OG-001-42', name: "Nike Air Force 1 '07", size: '42', qty: 1, unitPrice: 12500 },
      { sku: 'OG-011-L',  name: 'OG Heavyweight Tee',   size: 'L',  qty: 2, unitPrice: 2250 }
    ],
    subtotal: 17000, discount: 1700, pointsUsed: 0, total: 15300,
    payment: 'cash', cashier: 'Lubna Kayali',
    publicToken: 'a1b2c3d4e5f60718293a4b5c6d7e8f90',
    fxRate: 130
  };
}

setTimeout(function () {
  var s = sample();

  ['80', '58'].forEach(function (w) {
    OG.rc.width = w;
    openReceipt(s);

    var el = document.querySelector('.receipt');
    if (!el) { say('[' + w + '] NO RECEIPT'); return; }

    var want = w === '80' ? 70 : 50;
    var got = Number(mm(el.offsetWidth));
    var qr = document.querySelector('.rc-qr svg');
    var rule = document.getElementById('receiptPageRule');

    say('');
    say('======== ' + w + 'mm paper ========');
    say('  content   : ' + got + ' mm   want ' + want + '   ' + (Math.abs(got - want) < 0.6 ? 'OK' : '*** WRONG'));
    say('  QR        : ' + (qr ? mm(qr.getBoundingClientRect().width / 0.96) + ' mm' : '*** MISSING'));
    say('  @page     : ' + (rule ? rule.textContent.match(/@page\{[^}]*\}/)[0] : '*** MISSING'));
    say('  bodyclass : ' + (document.body.classList.contains('printing-receipt') ? 'set' : '*** NOT SET'));
    say('  height    : ' + mm(el.offsetHeight) + ' mm');

    /* No grey anywhere — a thermal head has no grey to print with. */
    var greys = [];
    el.querySelectorAll('*').forEach(function (n) {
      var c = getComputedStyle(n).color;
      if (c !== 'rgb(0, 0, 0)' && n.textContent.trim()) greys.push(n.className + ':' + c);
    });
    say('  non-black : ' + (greys.length ? '*** ' + greys.slice(0, 3).join(' | ') : 'none'));

    var bad = ['Cost', 'Margin', 'Profit', '>3000<'].filter(function (k) {
      return el.innerHTML.indexOf(k) > -1;
    });
    say('  cost leak : ' + (bad.length ? '*** ' + bad.join(',') : 'none'));

    say('  text      : ' + el.innerText.replace(/\s+/g, ' ').trim().slice(0, 300));

    closeModal();
    say('  cleared   : ' + (document.body.classList.contains('printing-receipt') ? '*** STILL SET' : 'yes'));
  });

  /* Arabic, right to left. */
  OG.lang = 'ar'; OG.rc.width = '80';
  openReceipt(s);
  var arEl = document.querySelector('.receipt');
  say('');
  say('======== Arabic ========');
  say('  dir       : ' + arEl.getAttribute('dir'));
  say('  width     : ' + mm(arEl.offsetWidth) + ' mm');
  say('  text      : ' + arEl.innerText.replace(/\s+/g, ' ').trim().slice(0, 220));
  /* A key that fell back to English would show up as a Latin word in an
     otherwise Arabic line. */
  say('  latin     : ' + (arEl.innerText.match(/\b(Subtotal|Discount|Total|Invoice|Date|Served|Customer|Exchange within)\b/g) || ['none']).join(','));
  closeModal();
  OG.lang = 'en';

  /* The QR must never promise a link it cannot keep. */
  say('');
  say('======== the QR link ========');
  say('  PUBLIC_URL : ' + CONFIG.PUBLIC_URL);
  say('  link       : ' + (receiptLink(s) === null
        ? 'none — text QR (correct: github.io has no /i/ route)'
        : receiptLink(s)));
  var was = CONFIG.PUBLIC_URL;
  CONFIG.PUBLIC_URL = 'http://10.10.99.9:8090';
  say('  LAN http   : ' + (receiptLink(s) === null ? 'refused (correct)' : '*** ' + receiptLink(s)));
  CONFIG.PUBLIC_URL = 'https://og.example.sy';
  say('  real https : ' + receiptLink(s));
  CONFIG.PUBLIC_URL = was;

  say('');
  say('JS ERRORS: ' + (errs.length ? errs.join(' | ') : 'NONE'));
  document.title = 'finished';
}, 900);
</script>
</body></html>
