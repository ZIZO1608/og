<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>mobile audit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main"><header class="topbar" id="topbar"></header><main class="view" id="view"></main></div>
</div>
<nav id="tabbar" class="tabbar"></nav>
<div id="toasts" class="toasts"></div>
<div id="palette-root"></div><div id="modal-root"></div><div id="drawer-root"></div>
<div id="tour-root"></div><div id="bulk-root"></div>
<div id="print-root" class="print-root"></div>
<button id="tourBtn" class="tour-fab" type="button">
  <span class="tour-fab-dot"></span><span id="tourBtnLabel">Demo tour</span>
</button>
<pre id="r" style="position:fixed;inset:0;z-index:9999;background:#000;color:#0f0;font:11px/1.4 monospace;padding:12px;overflow:auto;margin:0">running</pre>

<script src="js/vendor/chart.umd.min.js"></script>
<script src="js/codes.js"></script><script src="js/motion.js"></script>
<script src="js/export.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/pos.js"></script>
<script src="js/bulk.js"></script>
<script src="js/scan.js"></script><script src="js/wedge.js"></script><script src="js/stock.js"></script><script src="js/money.js"></script><script src="js/palette.js"></script><script src="js/whatsapp.js"></script><script src="js/notify.js"></script><script src="js/ylinvoice.js"></script><script src="js/yalla.js"></script>
<script src="js/app.js"></script>
<script>
/* The real test for "there is overlapping": measure, do not eyeball.
   Run at a 390px viewport across every screen, both languages, both portals.

   Two distinct failures are checked:
     OVERFLOW  an element sticking out past the viewport edge
     COLLISION two fixed elements occupying the same pixels
   A screenshot can miss either; bounding rectangles cannot. */
document.addEventListener('DOMContentLoaded', function () {
  var R = [], errs = [];
  window.addEventListener('error', function (e) { errs.push(e.message); });
  function ok(n, c, x) { R.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && x !== null ? ' — ' + x : '')); }

  /* Headless Chrome clamps the viewport to 500px however small --window-size
     is, so a true 390px viewport is not reachable that way. Instead the shell
     is pinned to 390px and everything is measured against THAT.

     The media queries still evaluate at 500px — but 390 and 500 fall inside
     the same two breakpoint bands (<560 and <720), so the identical CSS branch
     is exercised, with 110px less room to hide overflow in. That makes this a
     stricter test than the real device, not a weaker one. */
  var TARGET = 390;
  var appEl = document.getElementById('app');
  appEl.style.width = TARGET + 'px';
  appEl.style.overflow = 'hidden';
  var VW = TARGET;

  /* Elements allowed to exceed the viewport because they scroll horizontally
     on purpose — a kanban board and a wide data table are meant to. What is
     NOT allowed is the PAGE itself scrolling sideways. */
  /* Measured RELATIVE TO THE SHELL'S OWN BOX, not to absolute page
     coordinates. In RTL the document is still the real 500px viewport, so an
     Arabic page lays out from x=500 while the pinned shell starts at x=110 —
     comparing against 0..390 flagged every Arabic screen as broken when
     nothing was wrong. The container's left edge is the only correct origin. */
  function fixedAncestor(el) {
    for (var n = el; n && n !== document.body; n = n.parentElement) {
      if (getComputedStyle(n).position === 'fixed') return true;
    }
    return false;
  }

  function overflowing(root) {
    var bad = [];
    var base = appEl.getBoundingClientRect();
    root.querySelectorAll('*').forEach(function (el) {
      /* Containers that scroll sideways on purpose. Their children are
         SUPPOSED to exceed the viewport — a kanban board, a wide data table
         and a category chip strip are all meant to be swiped. */
      if (el.closest('.table-wrap, .kanban, .yl-board, .yl-radar, .yl-heat, .st-grid, .pos-cats')) return;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return;
      /* Skip anything inside a fixed-positioned subtree, not just elements
         that are fixed themselves. A fixed parent escapes the pinned shell
         and lays out against the real viewport, so its STATIC children
         measure against that too — the POS cart sheet's header read 0→504
         inside a 390px shell and looked like an overflow when it was simply
         being measured against the wrong box. */
      if (fixedAncestor(el)) return;
      var r = el.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      var left = r.left - base.left, right = r.right - base.left;
      if (right > VW + 1.5 || left < -1.5) {
        bad.push((el.className || el.tagName).toString().split(' ')[0] +
                 '[' + Math.round(left) + '→' + Math.round(right) + ']');
      }
    });
    return bad;
  }

  /* Fixed elements escape the pinned shell and live in the real viewport, so
     they are checked against that instead. */
  var REALVW = document.documentElement.clientWidth;

  function hits(a, b) {
    if (!a || !b) return false;
    var x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
    if (!x.width || !y.width) return false;
    return !(x.right <= y.left || x.left >= y.right || x.bottom <= y.top || x.top >= y.bottom);
  }

  try {
    boot();
    document.body.setAttribute('data-motion', 'off');   // measure the settled layout

    ok('measuring at a phone width', VW === 390 &&
       Math.round(appEl.getBoundingClientRect().width) === 390, VW + 'px');

    /* Widths of the shell, so an overflow can be traced to the container that
       caused it instead of guessed at from the leaf element. */
    go('dashboard');
    R.push('INFO shell — app=' + Math.round(document.getElementById('app').getBoundingClientRect().width) +
           ' main=' + Math.round(document.querySelector('.main').getBoundingClientRect().width) +
           ' view=' + Math.round(document.getElementById('view').getBoundingClientRect().width) +
           ' cols=' + getComputedStyle(document.getElementById('app')).gridTemplateColumns +
           ' dash=' + getComputedStyle(document.querySelector('.dash-grid') || document.body).gridTemplateColumns);

    /* ---------------------------------------------- the bar exists and fits */
    var bar = document.getElementById('tabbar');
    ok('tab bar is shown on a phone', getComputedStyle(bar).display !== 'none');
    ok('tab bar spans the width', Math.round(bar.getBoundingClientRect().width) === REALVW,
       Math.round(bar.getBoundingClientRect().width) + ' vs ' + REALVW);
    ok('sidebar is gone', getComputedStyle(document.getElementById('sidebar')).display === 'none');
    ok('5 tabs', bar.querySelectorAll('.tabbtn').length === 5, bar.querySelectorAll('.tabbtn').length);
    var tallEnough = [].every.call(bar.querySelectorAll('.tabbtn'),
      function (b) { return b.getBoundingClientRect().height >= 44; });
    ok('every tab is at least 44px tall', tallEnough);

    /* --------------------------------------- topbar is not overcrowded */
    /* Count CONTROLS, not child nodes — the topbar carries a flex .spacer
       that is layout, not something the user can press. Counting it made a
       four-control bar report as five. */
    var visibleTop = [].filter.call(
      document.getElementById('topbar').children,
      function (el) {
        if (getComputedStyle(el).display === 'none') return false;
        return !el.classList.contains('spacer');
      });
    ok('topbar keeps at most 4 controls', visibleTop.length <= 4,
       visibleTop.length + ' shown: ' + [].map.call(visibleTop, function (el) {
         return el.className || el.tagName;
       }).join(', '));
    /* And they must still fit side by side without wrapping.
       Named topRect, not bar — `bar` is already the tab-bar element further
       down and `var` is function-scoped, so reusing the name silently
       replaced an element with a DOMRect. */
    var topRect = document.getElementById('topbar').getBoundingClientRect();
    ok('topbar controls fit on one line',
       [].every.call(visibleTop, function (el) {
         var r = el.getBoundingClientRect();
         return r.top >= topRect.top - 1 && r.bottom <= topRect.bottom + 1;
       }));

    /* ------------------------------------- every screen, both languages */
    var SCREENS = ['dashboard', 'pos', 'products', 'warehouse', 'customers',
                   'print', 'reports', 'storefront', 'settings'];
    ['en', 'ar'].forEach(function (lang) {
      OG.lang = lang; applyLang(); refreshAll();
      SCREENS.forEach(function (v) {
        go(v);
        var bad = overflowing(document.getElementById('view'));
        ok(lang + ':' + v + ' fits 390px', bad.length === 0, bad.slice(0, 2).join(' '));
      });
      /* The shell itself must never need to scroll sideways. */
      ok(lang + ': no horizontal shell scroll',
         appEl.scrollWidth <= VW + 1, appEl.scrollWidth + ' vs ' + VW);
    });
    OG.lang = 'en'; applyLang(); refreshAll();

    /* ------------------------- warehouse: every tab, and every place
       The screens loop above only ever sees whichever tab happens to be
       selected, so the four it does not open were never measured. The stock
       tab in particular carries a per-size strip that is the widest run of
       content anywhere in the app. */
    ['stock', 'add', 'moves', 'po', 'count'].forEach(function (tab) {
      OG.wh.tab = tab; go('warehouse');
      var bad = overflowing(document.getElementById('view'));
      ok('warehouse:' + tab + ' fits 390px', bad.length === 0, bad.slice(0, 2).join(' '));
    });

    OG.wh.tab = 'stock';
    ['all', 'floor', 'store'].forEach(function (place) {
      OG.wh.place = place; go('warehouse');
      var bad = overflowing(document.getElementById('view'));
      ok('warehouse place:' + place + ' fits 390px', bad.length === 0, bad.slice(0, 2).join(' '));
      ok('place:' + place + ' shell does not scroll sideways',
         appEl.scrollWidth <= VW + 1, appEl.scrollWidth + ' vs ' + VW);
    });

    /* The size strip is allowed to scroll inside itself, but only inside
       itself — it must never widen the row it sits in. */
    OG.wh.place = 'all'; go('warehouse');
    var strip = document.querySelector('.wh-sizes');
    ok('a size strip is rendered', !!strip);
    if (strip) {
      var cell = strip.parentNode;
      ok('the size strip stays inside its cell',
         strip.getBoundingClientRect().width <= cell.getBoundingClientRect().width + 1,
         Math.round(strip.getBoundingClientRect().width) + ' vs ' +
         Math.round(cell.getBoundingClientRect().width));
    }
    OG.wh.tab = 'stock'; OG.wh.place = 'all';

    /* --------------------------- the scan sheet, which is a MODAL
       The screens loop above never opens it, but it is now the landing place
       for every hardware scan — so it is the screen the warehouse sees most,
       phone in one hand and scanner in the other. */
    OG.wh.tab = 'stock'; go('dashboard');
    openScanResult(DB.variants[0].sku);
    var sheet = document.querySelector('#modal-root .modal');
    ok('the scan sheet opens', !!sheet);
    if (sheet) {
      var badSheet = overflowing(sheet);
      ok('scan sheet fits 390px', badSheet.length === 0, badSheet.slice(0, 2).join(' '));

      /* The action row is the point of the sheet; if it needs sideways
         scrolling on a phone the feature is unusable in the stockroom. */
      var acts = sheet.querySelector('.sc-acts');
      ok('the action row is present', !!acts);
      if (acts) {
        var ar = acts.getBoundingClientRect();
        var pr = acts.parentElement.getBoundingClientRect();
        ok('actions stay inside the card', ar.right <= pr.right + 1.5,
           Math.round(ar.right) + ' vs ' + Math.round(pr.right));
        /* Stacked on a phone, so each is a full-width thumb target. */
        var tall = [].every.call(acts.querySelectorAll('.btn'),
          function (b) { return b.getBoundingClientRect().height >= 40; });
        ok('every action is thumb-sized', tall);
      }
    }
    closeModal();

    /* ------------------------------------------- the Yalla portal too */
    OG.print.partner = true; YALLA.reset(); refreshAll();
    ok('partner tab bar rendered', document.querySelectorAll('#tabbar .tabbtn').length === 5);
    ['today', 'queue', 'invoices', 'earnings'].forEach(function (v) {
      YALLA.state.view = v; render();
      var bad = overflowing(document.getElementById('view'));
      ok('yalla:' + v + ' fits 390px', bad.length === 0, bad.slice(0, 2).join(' '));
    });
    OG.print.partner = false; refreshAll();

    /* --------------------------- the three bottom-edge collisions */
    go('products');
    Bulk.visibleIds('products').slice(0, 3).forEach(function (id) { Bulk._sel.products[id] = true; });
    render(); Bulk.paint();
    var bk = document.querySelector('.bk-bar');
    ok('bulk bar is showing', !!bk);
    if (bk) {
      R.push('INFO bottoms — tabbarH=' + getComputedStyle(document.documentElement).getPropertyValue('--tabbar-h').trim() +
             ' bkBottom=' + getComputedStyle(bk).bottom +
             ' innerH=' + window.innerHeight +
             ' barTop=' + Math.round(bar.getBoundingClientRect().top) +
             ' barH=' + Math.round(bar.getBoundingClientRect().height) +
             ' bkRect=' + Math.round(bk.getBoundingClientRect().bottom));
    }
    ok('bulk bar clears the tab bar', !hits(bk, bar),
       bk ? Math.round(bk.getBoundingClientRect().bottom) + ' vs ' + Math.round(bar.getBoundingClientRect().top) : '');
    Bulk.clear('products'); render(); Bulk.paint();

    var fab = document.getElementById('tourBtn');
    ok('tour button clears the tab bar', !hits(fab, bar));

    go('pos');
    var done = document.querySelector('.cart-foot .btn-primary, [data-pos="complete"]');
    ok('POS complete-sale button exists', !!done);
    ok('tour button hidden on POS', getComputedStyle(fab).display === 'none');

    /* The cart is a bottom sheet on a phone: collapsed to a handle above the
       tab bar, expanded on tap. Both states must clear the navigation. */
    var sheet = document.querySelector('.pos-right');
    ok('the cart is a sheet on a phone', sheet && getComputedStyle(sheet).position === 'fixed');

    /* Collapsed, the sheet is DELIBERATELY taller than the screen — it is
       translated down so only the handle shows. So the thing to measure is
       the visible handle, not the whole box, which legitimately hangs off the
       bottom by the height of the cart. */
    var head = document.querySelector('.cart-head');
    var barTop = bar.getBoundingClientRect().top;
    ok('the handle is visible above the tab bar',
       head && head.getBoundingClientRect().bottom <= barTop + 1,
       head ? Math.round(head.getBoundingClientRect().bottom) + ' vs ' + Math.round(barTop) : '');
    ok('the handle is tappable', head && head.getBoundingClientRect().height >= 44,
       head ? Math.round(head.getBoundingClientRect().height) + 'px' : '');

    /* The sheet slides on a transform transition. Measuring immediately after
       flipping the attribute reads the transition at zero progress — i.e. the
       collapsed position — so the transition is cancelled first and the
       RESTING position is what gets asserted. */
    var openSheet = document.querySelector('.pos-right');
    openSheet.style.transition = 'none';
    document.body.setAttribute('data-cart', 'open');
    void openSheet.offsetWidth;
    ok('expanded, the sheet bottom rests on the tab bar',
       openSheet.getBoundingClientRect().bottom <= barTop + 1,
       Math.round(openSheet.getBoundingClientRect().bottom) + ' vs ' + Math.round(barTop));
    ok('expanded, it does not run off the top',
       openSheet.getBoundingClientRect().top >= -1,
       Math.round(openSheet.getBoundingClientRect().top));
    document.body.removeAttribute('data-cart');
    openSheet.style.transition = '';

    /* Wide tables restack into cards, each cell carrying its own label. */
    go('products');
    var tbl = document.querySelector('table.tbl.tbl-cards');
    ok('wide tables become cards', !!tbl);
    if (tbl) {
      var labelled = tbl.querySelectorAll('tbody td[data-l]').length;
      ok('cells carry their column label', labelled > 0, labelled + ' cells');
      ok('the header row is hidden',
         getComputedStyle(tbl.querySelector('thead')).display === 'none');
    }

    /* ------------------------------------------------ the More sheet */
    go('dashboard');
    var mb = document.createElement('button');
    mb.setAttribute('data-act', 'more-sheet');
    document.body.appendChild(mb); mb.click(); mb.remove();
    var sheet = document.querySelector('.modal.sheet');
    var back = document.querySelector('.modal-backdrop.as-sheet');
    ok('More opens as a bottom sheet', !!sheet);
    /* Measured against the BACKDROP, which is the sheet's own positioning
       context, not against window.innerHeight. In this headless environment
       fixed elements resolve against an 818px box while innerHeight reports
       804 — comparing to innerHeight made a correctly-placed sheet look 14px
       short. What actually matters is that the sheet is flush with the
       bottom of its backdrop; that holds on a real device too. */
    /* The entrance animation starts at translateY(100%), and nothing has
       painted yet at this point, so the backwards fill still applies — the
       sheet measures a full height below where it will settle. Cancel the
       animation to read the RESTING position, which is the thing under test. */
    if (sheet) sheet.style.animation = 'none';
    ok('it sits flush with the bottom of its backdrop', sheet && back &&
       Math.abs(sheet.getBoundingClientRect().bottom - back.getBoundingClientRect().bottom) < 2,
       sheet && back ? Math.round(sheet.getBoundingClientRect().bottom) + ' vs ' +
         Math.round(back.getBoundingClientRect().bottom) : '');
    ok('and spans the full width', sheet && back &&
       Math.abs(sheet.getBoundingClientRect().width - back.getBoundingClientRect().width) < 2);
    ok('it lists the other screens', document.querySelectorAll('.more-item').length === 5,
       document.querySelectorAll('.more-item').length);
    ok('and carries language + currency', document.querySelectorAll('.more-row .seg').length === 2);
    /* The sheet is fixed-position, so it belongs to the real viewport. */
    ok('sheet fits its viewport', sheet &&
       sheet.getBoundingClientRect().right <= REALVW + 1.5 &&
       sheet.getBoundingClientRect().left >= -1.5,
       sheet ? Math.round(sheet.getBoundingClientRect().left) + '→' + Math.round(sheet.getBoundingClientRect().right) : '');
    closeModal();

    ok('no console errors', errs.length === 0, errs.slice(0, 2).join(' | '));
  } catch (e) {
    R.push('THROW — ' + e.message + '\n' + (e.stack || '').split('\n').slice(1, 4).join('\n'));
  }

  /* INFO lines are diagnostics, not assertions — they must not count as
     failures or the tally lies. */
  var checks = R.filter(function (x) { return x.indexOf('INFO') !== 0; });
  var fails = checks.filter(function (x) { return x.indexOf('PASS') !== 0; });
  document.getElementById('r').textContent =
    '=== ' + (checks.length - fails.length) + '/' + checks.length + ' passed @' + VW + 'px ===\n\n' +
    (fails.length ? fails.join('\n') + '\n\n---\n' : '') + R.join('\n');
});
</script>
</body></html>
