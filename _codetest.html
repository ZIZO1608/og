<!doctype html>
<html><head><meta charset="utf-8"><title>codes test</title></head><body>
<script>window.__errs=[];window.onerror=function(m,s,l){window.__errs.push(m+' @'+l);};</script>
<script src="js/codes.js"></script>
<script>
(function () {
  var R = [];
  function ok(n, c, x) { R.push((c ? 'PASS ' : 'FAIL ') + n + (x ? ' — ' + x : '')); }

  /* ---------------------------------------------------------------- EAN-13 */

  /* Decode a 95-module string back to 13 digits, independently of the encoder. */
  var L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  var G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  var Rr= ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  var PAR= ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  function eanDecode(mods) {
    if (mods.length !== 95) return null;
    if (mods.slice(0,3) !== '101' || mods.slice(45,50) !== '01010' || mods.slice(92) !== '101') return null;
    var parity = '', digits = '', i, k, seg, d;
    for (i = 0; i < 6; i++) {
      seg = mods.substr(3 + i*7, 7); d = -1;
      for (k = 0; k < 10; k++) { if (L[k] === seg) { d = k; parity += 'L'; break; } if (G[k] === seg) { d = k; parity += 'G'; break; } }
      if (d < 0) return null;
      digits += d;
    }
    var first = PAR.indexOf(parity);
    if (first < 0) return null;
    for (i = 0; i < 6; i++) {
      seg = mods.substr(50 + i*7, 7); d = Rr.indexOf(seg);
      if (d < 0) return null;
      digits += d;
    }
    return '' + first + digits;
  }

  var samples = ['6221033012844', '4006381333931', '9780201379624', '5901234123457'];
  var eanOk = 0;
  samples.forEach(function (code) {
    var mods = Codes.ean13(code);
    var back = mods && eanDecode(mods);
    if (mods && mods.length === 95 && back === code && Codes.ean13Valid(code)) eanOk++;
    else R.push('FAIL ean13 ' + code + ' — len=' + (mods ? mods.length : 'null') + ' back=' + back);
  });
  ok('EAN-13 round-trip (' + samples.length + ' codes)', eanOk === samples.length, eanOk + '/' + samples.length);
  ok('EAN-13 checksum', Codes.ean13Check('622103301284') === 4, 'got ' + Codes.ean13Check('622103301284'));
  ok('EAN-13 rejects bad check', !Codes.ean13Valid('6221033012845'));
  ok('EAN-13 SVG emits rects', (Codes.ean13SVG('6221033012844').match(/<rect/g) || []).length > 20);

  /* -------------------------------------------------------------------- QR */

  var T = Codes._tables;

  /* Full decode: rebuild function map, unmask, reverse the zigzag,
     de-interleave the blocks, then parse the byte-mode header. */
  function qrDecode(qr) {
    var size = qr.size, v = qr.version, m = qr.modules, reserved = qr.reserved, i, k, r, c;

    /* read format info copy 1 to recover ecc level + mask */
    var fbits = 0;
    for (i = 0; i < 15; i++) {
      var b;
      if (i < 6) b = m[i][8];
      else if (i === 6) b = m[7][8];
      else if (i === 7) b = m[8][8];
      else if (i === 8) b = m[8][7];
      else b = m[8][14 - i];
      fbits |= b << i;
    }
    fbits ^= 0x5412;
    var eccBits = (fbits >> 13) & 3, mask = (fbits >> 10) & 7;
    var ecc = { 1: 'L', 0: 'M', 3: 'Q', 2: 'H' }[eccBits];
    if (!ecc || !T.ECC[ecc]) return { err: 'bad format info' };

    /* unmask everything that is not a function module */
    var f = T.MASKS[mask], um = [];
    for (r = 0; r < size; r++) { um[r] = []; for (c = 0; c < size; c++) um[r][c] = reserved[r][c] ? m[r][c] : (m[r][c] ^ (f(r, c) ? 1 : 0)); }

    /* reverse zigzag into a codeword stream */
    var bits = [], dir = -1, row = size - 1;
    for (var col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (;;) {
        for (i = 0; i < 2; i++) { var cc = col - i; if (!reserved[row][cc]) bits.push(um[row][cc]); }
        row += dir;
        if (row < 0 || row >= size) { row -= dir; dir = -dir; break; }
      }
    }
    var stream = [];
    for (i = 0; i + 8 <= bits.length; i += 8) { var byteV = 0; for (k = 0; k < 8; k++) byteV = (byteV << 1) | bits[i + k]; stream.push(byteV); }

    /* de-interleave data codewords back into their blocks */
    var e = T.ECC[ecc][v];
    var lens = [], b2;
    for (b2 = 0; b2 < e[1]; b2++) lens.push(e[2]);
    for (b2 = 0; b2 < e[3]; b2++) lens.push(e[4]);
    var blocks = lens.map(function () { return []; });
    var maxLen = Math.max(e[2], e[4]), p = 0;
    for (i = 0; i < maxLen; i++) {
      for (b2 = 0; b2 < blocks.length; b2++) if (i < lens[b2]) blocks[b2].push(stream[p++]);
    }
    var data = [];
    blocks.forEach(function (bl) { data = data.concat(bl); });

    /* parse byte-mode header */
    var dbits = [];
    data.forEach(function (byteV) { for (k = 7; k >= 0; k--) dbits.push((byteV >> k) & 1); });
    function take(n) { var val = 0; for (var q = 0; q < n; q++) val = (val << 1) | dbits.shift(); return val; }
    var mode = take(4);
    if (mode !== 4) return { err: 'mode=' + mode };
    var len = take(v < 10 ? 8 : 16);
    var out = [];
    for (i = 0; i < len; i++) out.push(take(8));
    return { ecc: ecc, mask: mask, text: decodeURIComponent(out.map(function (x) { return '%' + ('0' + x.toString(16)).slice(-2); }).join('')) };
  }

  var payloads = [
    'OG-001-41',
    'OG SYSTEM\nNike Air Force 1 \'07\nSize 41 | OG-001-41\n1,250,000 SYP | A-05',
    'https://ogsystem.sy/s/OG-024-XL',
    'INV-2224 | 1,475,000 SYP | 12 Aug 2026 | OG System',
    'يلا وير'
  ];

  var qrOk = 0;
  payloads.forEach(function (p) {
    var qr = Codes.qrMatrix(p);
    if (!qr) { R.push('FAIL qr encode (null) — ' + p.slice(0, 24)); return; }
    var d = qrDecode(qr);
    if (d.err) { R.push('FAIL qr decode ' + d.err + ' — ' + p.slice(0, 24)); return; }
    if (d.text !== p) { R.push('FAIL qr round-trip — got "' + d.text.slice(0, 40) + '"'); return; }
    qrOk++;
  });
  ok('QR round-trip (' + payloads.length + ' payloads)', qrOk === payloads.length, qrOk + '/' + payloads.length);

  /* structural invariants */
  var q = Codes.qrMatrix('OG-001-41');
  ok('QR size = 4v+17', q.size === q.version * 4 + 17, 'v' + q.version + ' size' + q.size);
  ok('QR ecc = H', q.ecc === 'H', q.ecc);
  var fin = q.modules[0][0] && q.modules[0][6] && q.modules[6][0] && q.modules[6][6] &&
            !q.modules[1][1] && q.modules[2][2] && q.modules[3][3];
  ok('QR finder pattern intact', fin);
  var timing = true;
  for (var i2 = 8; i2 < q.size - 8; i2++) { if (q.modules[6][i2] !== (i2 % 2 === 0 ? 1 : 0)) timing = false; }
  ok('QR timing pattern intact', timing);
  ok('QR dark module set', q.modules[q.size - 8][8] === 1);

  /* version scaling + level fallback */
  var big = Codes.qrMatrix(new Array(150).join('x'));
  ok('QR grows with payload', big && big.version >= 7, big ? ('v' + big.version + ' ' + big.ecc) : 'null');
  ok('QR falls back to M when H will not fit', big && big.ecc === 'M', big ? big.ecc : '-');
  ok('QR returns null past capacity', Codes.qrMatrix(new Array(400).join('x')) === null);
  ok('QR SVG renders', Codes.qrSVG('OG-001-41', { size: 120 }).indexOf('<svg') === 0);

  var out = document.createElement('pre'); out.id = 'r';
  var fails = R.filter(function (x) { return x.indexOf('PASS') !== 0; });
  out.textContent = '=== ' + (R.length - fails.length) + '/' + R.length + ' ===\nERR: ' +
    (window.__errs.length ? window.__errs.join(' | ') : 'none') + '\n' + R.join('\n');
  document.body.appendChild(out);
})();
</script></body></html>
