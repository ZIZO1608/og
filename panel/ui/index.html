<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OG System</title>

<!-- Edge in --app mode takes the PAGE's icon for its taskbar button. Without
     this line the launcher's own window sits in the taskbar as the browser's
     grey globe, looking like somebody's stray tab. -->
<link rel="icon" type="image/png" sizes="128x128" href="/ui/icon.png">

<!-- The shop's own Montserrat, vendored, served by the panel process. No CDN,
     and nothing here needs the server to be running. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/ui/panel.css">
</head>
<body>

<!-- The key is minted when the panel process starts and put here on the way
     out. It never leaves this machine: the listener is bound to 127.0.0.1,
     and this is what stops any other page in any other tab from posting Stop
     to the till. -->
<script>window.OG_KEY = '__KEY__';</script>

<header class="bar">
  <img class="mark" src="/assets/logo.svg" alt="">
  <h1>OG System</h1>

  <div class="spacer"></div>

  <div class="lamp" id="lamp"><span class="dot"></span><span id="lampText">Closed</span></div>

  <button class="icon-btn lang-btn" id="bLang" data-go="lang" title="Switch to Arabic">عربي</button>

  <!-- The developer door. Locked, it asks for a developer's own sign-in;
       unlocked, it is the way back to the developer screens, and the chip
       beside it says who opened it and carries the Lock. -->
  <div class="devchip" id="devChip" hidden>
    <span class="who" id="devWho"></span>
    <button class="lockbtn" data-do="lock" id="bLock">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span id="bLockText">Lock</span>
    </button>
  </div>
  <button class="icon-btn" id="bDev" data-go="dev" title="Developer" aria-label="Developer">
    <svg class="ic-locked" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <svg class="ic-open" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3"/><path d="m16 9 4 3-4 3"/><path d="m13.5 6-3 12"/></svg>
  </button>
</header>

<main>

  <!-- ============================================================== SHOP
       The screen this window opens on, every time, and the only one anybody
       without the developer sign-in ever sees: whether the shop is open, the
       buttons to open, stop, restart and test the printers, the address to
       type on a phone, and what the shop leans on. -->
  <section class="screen center" id="scShop">
    <div class="hero">

      <div class="stage" id="stage">
        <svg class="ring" viewBox="0 0 116 116" aria-hidden="true">
          <circle class="track" cx="58" cy="58" r="54"/>
          <circle class="arc" id="arc" cx="58" cy="58" r="54"/>
        </svg>
        <i class="orbit" aria-hidden="true"></i>
        <div class="mark"><img src="/assets/logo.svg" alt=""></div>
      </div>

      <h2 id="hTitle">…</h2>
      <p class="sub" id="hSub"></p>

      <div class="acts" id="acts"></div>

      <!-- Only one of these two is ever on screen: the list while the shop is
           opening, the address once it is open. -->
      <div class="steps" id="steps" hidden></div>

      <div class="handover" id="handover" hidden></div>
      <div class="verdict" id="verdict" hidden></div>
      <div class="addrs" id="addrs" hidden></div>
      <div class="notices" id="notices" hidden></div>
      <div class="cloudline" id="cloudline" hidden></div>
      <div class="conn" id="connShop"></div>
    </div>
  </section>

  <!-- ========================================================= DEVELOPER
       Everything a developer needs and nobody in the shop ever presses,
       behind a developer's own sign-in. The panel process refuses every one
       of these actions while locked, whatever this page draws. -->
  <section class="screen dev" id="scDev" hidden>
    <div class="head dev-head">
      <button class="back" data-go="shop">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        <span id="dBack">Back</span>
      </button>
      <nav class="tabs" id="devTabs" role="tablist"></nav>
    </div>

    <div class="pane" id="pTools">
      <div class="pad"><div class="groups" id="groups"></div></div>
    </div>

    <div class="pane term-pane" id="pLog" hidden>
      <div class="term">
        <div class="termbar">
          <label class="follow"><input type="checkbox" id="follow" checked> <span id="lFollow">Follow</span></label>
          <p class="hint" id="lSw"></p>
          <div class="spacer"></div>
          <button class="btn btn-sm btn-ghost" data-do="clear" id="lClear">Clear</button>
          <button class="btn btn-sm btn-danger" data-do="quit" id="lQuit">Quit</button>
        </div>
        <pre id="out" class="out" tabindex="0"></pre>
      </div>
    </div>

    <div class="pane" id="pConn" hidden>
      <div class="pad"><div class="narrow"><div class="conn" id="connDev"></div></div></div>
    </div>

    <div class="pane" id="pAcc" hidden>
      <div class="pad"><div class="narrow" id="accBox"></div></div>
    </div>

    <div class="pane" id="pInfo" hidden>
      <div class="pad"><div class="narrow" id="infoBox"></div></div>
    </div>
  </section>

</main>

<div id="refresh" class="rf" hidden role="dialog" aria-modal="true" aria-live="polite"></div>
<div id="ask" class="ask" hidden role="dialog" aria-modal="true"></div>
<div id="toasts" class="toasts"></div>

<script src="/ui/i18n.js"></script>
<!-- The shop's own encoders, served by the panel. js/codes.js already holds a
     complete QR implementation and is self-contained — writing a second one
     next to a working one is how two things that must agree stop agreeing. -->
<script src="/shop/codes.js"></script>
<script src="/ui/panel.js"></script>
</body>
</html>
