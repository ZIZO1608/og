# =============================================================================
#  OG SYSTEM — build and publish
# -----------------------------------------------------------------------------
#  One job: build dist/ and publish it to GitHub Pages.
#
#  There are no automated tests any more. They were removed on request; the
#  earlier version of this file ran 986 checks and refused to deploy if any of
#  them failed. Nothing now inspects a push before it goes out, so a change
#  that breaks the till reaches the live site exactly as fast as one that
#  fixes it. If you want that safety back, the suites are recoverable from git
#  history:
#
#      git show d76950a --stat            # the last commit that had them
#      git checkout d76950a -- server/test _selftest.html
#
#  PAGES IS CURRENTLY OFF. The repository is private, and a free GitHub plan
#  does not serve Pages from a private repository. This workflow notices and
#  skips publishing rather than failing. Make the repo public again, or upgrade
#  the plan, and it resumes on the next push with no edit here.
#
#  The app is served by server/ now: `cd server && npm start`.
# =============================================================================

name: build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

# Needed by actions/deploy-pages. `contents: read` is the default minimum.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one win rather than racing
# two deploys at the same URL. `cancel-in-progress: false` so a deploy already
# uploading is allowed to finish cleanly instead of leaving Pages half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the shipping files are all present
        # The three files a hand-upload kept forgetting. Cheap to assert, and it
        # catches a rename that would otherwise produce a blank live site.
        # With the test suites gone this is the only check left before publish.
        run: |
          missing=0
          for f in index.html sw.js manifest.webmanifest robots.txt .nojekyll; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing

      - name: Build dist/
        # The same copy list as make-deploy.ps1: five root files plus three
        # folders, then strip anything underscore-prefixed. Kept in step with
        # that script by hand — if you add a folder to one, add it to the other.
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist

          for f in index.html manifest.webmanifest sw.js robots.txt .nojekyll; do
            [ -f "$f" ] && cp "$f" dist/ && echo "  + $f"
          done

          for d in css js assets; do
            [ -d "$d" ] && cp -r "$d" dist/ && echo "  + $d/"
          done

          # Safety net, mirrored from make-deploy.ps1. _shot.html still lives in
          # the root — it is the screenshot rig make-proposal.ps1 drives to build
          # the Arabic client PDF, not a test — and it must never reach the site.
          find dist -name '_*' -type f -print -delete | sed 's/^/  - stripped /'

          echo ""
          echo "  files: $(find dist -type f | wc -l)   size: $(du -sh dist | cut -f1)"

      - name: Report the service-worker cache name
        # A forgotten cache bump is the single most common reason an update
        # looks like it did not work on a phone. Surfacing it here means the
        # version that went live is recorded in the run, not guessed at later.
        run: |
          cache=$(grep -o "CACHE *= *'[^']*'" dist/sw.js | head -1 | sed "s/.*'\(.*\)'/\1/")
          echo "service worker cache: $cache"
          echo "### Published \`$cache\`" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------------
      #  Is Pages actually available?
      # ---------------------------------------------------------------------
      #  The repository was made private, which is the right call before real
      #  customer data exists — but on a free plan GitHub Pages does not serve
      #  private repositories, so the site is switched off at GitHub's end.
      #
      #  Failing the build over that would be wrong: nothing is broken, a
      #  deliberate decision was taken. So check first, and skip cleanly with an
      #  explanation.
      - name: Check whether Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$code" = "200" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "  Pages is enabled — publishing."
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "  Pages is not enabled for this repository (HTTP $code)."
            echo ""
            echo "  Expected if the repository is private: GitHub Pages needs a"
            echo "  public repository, or a paid plan. The build succeeded; only"
            echo "  publishing was skipped."
            {
              echo "### Built, but not published"
              echo ""
              echo "Pages is off (HTTP \`$code\`) — normal for a private repo on a free plan."
              echo "Serve the app from \`server/\` instead: \`npm start\`."
            } >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
